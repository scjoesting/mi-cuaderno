<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Cuaderno</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#E9EDF3; --ink:#1B2030; --muted:#5D6579; --line:#D5DBE5;
  --accent:#1E5AA8; --accent-ink:#FFFFFF; --accent-soft:#E1EAF7;
  --sun:#F2B134; --sun-soft:#FBEBC7; --sun-ink:#4A3200;
  --good:#23845A; --good-soft:#DCF2E6; --warn:#A8730A; --warn-soft:#FBEFD0; --bad:#BE2F3D; --bad-soft:#F9E0E3;
  --masc:#2A66C4; --fem:#B9457A;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 8px 24px rgba(20,30,60,.08);
  --radius:14px;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141C; --surface:#1A1F2B; --surface-2:#232937; --ink:#ECEEF4; --muted:#A4ABBC; --line:#333B4E;
    --accent:#79A9F0; --accent-ink:#0E1B31; --accent-soft:#1E2B45;
    --sun:#F2B134; --sun-soft:#3B3220; --sun-ink:#FBE3A6;
    --good:#5FC792; --good-soft:#1B3428; --warn:#E6B44B; --warn-soft:#3A3120; --bad:#F27C86; --bad-soft:#3E2025;
    --masc:#86B0F2; --fem:#EA92B7;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#11141C; --surface:#1A1F2B; --surface-2:#232937; --ink:#ECEEF4; --muted:#A4ABBC; --line:#333B4E;
  --accent:#79A9F0; --accent-ink:#0E1B31; --accent-soft:#1E2B45;
  --sun:#F2B134; --sun-soft:#3B3220; --sun-ink:#FBE3A6;
  --good:#5FC792; --good-soft:#1B3428; --warn:#E6B44B; --warn-soft:#3A3120; --bad:#F27C86; --bad-soft:#3E2025;
  --masc:#86B0F2; --fem:#EA92B7;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
.app{max-width:920px;margin:0 auto;padding-inline:16px;padding-block:0 48px;min-height:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 8px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.02em}
.brand h1{font-size:24px;font-weight:700}
.brand small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:400}
.streak{display:flex;align-items:center;gap:8px;background:var(--sun-soft);color:var(--sun-ink);border-radius:999px;padding:6px 12px 6px 8px;font-weight:700;font-variant-numeric:tabular-nums}
.streak svg{color:var(--sun)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:8px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:1px solid transparent;background:transparent;border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:88px;color:var(--muted);line-height:1.2}
.tab svg{display:none}
.tab b{font-family:var(--display);font-weight:700;font-size:15px;color:var(--ink)}
.tab span{font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.tab[aria-current="page"]{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow);color:var(--accent)}
.tab[aria-current="page"] b{color:var(--accent)}
main{display:flex;flex-direction:column;gap:20px}
main>*,.panel,.row,.stats,.grid{min-width:0}
.row>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.panel.lift{box-shadow:var(--shadow)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.h2{font-size:26px;font-weight:700}
.h3{font-size:19px;font-weight:700}
.sub{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .08s ease,background .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.big{padding:14px 22px;font-size:17px;border-radius:12px}
.btn.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.btn.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.btn.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn small{font-weight:400;font-size:12px;opacity:.8}
.unit{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.unit h3{font-size:18px}
.unit .en{color:var(--muted);font-size:14px}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s ease}
.bar.sun i{background:var(--sun)}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.unit .row{margin-top:auto}
.unit .row{flex-wrap:nowrap}
.unit .btn{flex:1;padding:8px 10px;font-size:14px}
select,input[type=text]{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px}
input[type=text]{font-size:20px;width:100%}
label.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
label.check input{width:18px;height:18px;accent-color:var(--accent)}
.fc-wrap{display:flex;flex-direction:column;gap:14px}
.fc{position:relative;height:300px;perspective:1200px;cursor:pointer;border:0;background:transparent;padding:0;width:100%;text-align:center}
.fc-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:28px 24px;border:1px solid var(--line);box-shadow:var(--shadow)}
.fc-face.front{background:var(--surface)}
.fc-face.back{background:var(--accent-soft);transform:rotateY(180deg);padding-bottom:124px}
.fc-word{font-family:var(--display);font-size:clamp(28px,6vw,44px);font-weight:700;line-height:1.1;text-wrap:balance}
.fc-hint{position:absolute;bottom:14px;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.04em}
.tag.m{background:var(--accent-soft);color:var(--masc)}
.tag.f{background:var(--bad-soft);color:var(--fem)}
.tag.n{background:var(--surface-2);color:var(--muted)}
.speak{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;display:inline-grid;place-items:center;color:var(--accent)}
.speak:hover{background:var(--accent-soft)}
.fc-grade{position:absolute;left:14px;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px}
.fc-grade .lbl{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;text-align:center}
.fc-grade .btns{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.fc-grade .btn{flex-direction:column;gap:3px;padding:10px 6px;line-height:1.2;font-size:16px}
.fc-grade .btn svg{width:26px;height:26px}
.fc-grade .btn small{display:block}
.kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;opacity:.7}
.opts{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:560px){.opts{grid-template-columns:1fr 1fr}}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;font-size:18px;display:flex;gap:12px;align-items:center}
.opt:hover{background:var(--surface-2)}
.opt .k{width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted);flex:none}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.prompt{font-family:var(--display);font-size:clamp(26px,5vw,38px);font-weight:700;line-height:1.15}
.feedback{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.feedback.good{background:var(--good-soft);color:var(--good)}
.feedback.warn{background:var(--warn-soft);color:var(--warn)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback b{font-family:var(--display);font-size:18px}
.feedback .ink{color:var(--ink)}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.key{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;min-width:40px;height:40px;font-size:18px;font-weight:700}
.key:hover{background:var(--accent-soft)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.hl{background:var(--sun-soft);color:var(--sun-ink);font-weight:700;border-radius:6px}
td b.es{color:var(--accent)}
details{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
details+details{margin-top:10px}
summary{cursor:pointer;padding:14px 18px;font-family:var(--display);font-weight:700;font-size:17px;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--muted);font-size:20px;font-weight:500}
details[open] summary::after{content:"–"}
details .body{padding:0 18px 18px;display:flex;flex-direction:column;gap:12px;max-width:68ch}
details .body p,details .body li{line-height:1.55}
details ul{margin:0;padding-left:20px}
.es{color:var(--accent);font-weight:700}
.tip{background:var(--sun-soft);color:var(--sun-ink);border-radius:10px;padding:10px 14px;font-size:15px}
.chat{display:flex;flex-direction:column;gap:10px;min-height:200px}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;line-height:1.5}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.msg.ai.thinking{color:var(--muted);font-style:italic}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px}
.chip:hover{background:var(--accent-soft)}
.ask{display:flex;gap:8px}
.ask input{flex:1;font-size:16px}
.explain{margin-top:8px}
.explain p{color:var(--ink);white-space:pre-wrap;margin-top:8px;line-height:1.55}
.summary-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.summary-nums div{border-radius:12px;padding:14px 8px}
.summary-nums b{display:block;font-family:var(--display);font-size:32px;font-variant-numeric:tabular-nums}
.summary-nums .g{background:var(--good-soft);color:var(--good)}
.summary-nums .w{background:var(--warn-soft);color:var(--warn)}
.summary-nums .b{background:var(--bad-soft);color:var(--bad)}
.footer{color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:10px}
.sr{position:absolute;left:-9999px}
@media (prefers-reduced-motion: reduce){.fc-inner,.bar i,.btn{transition:none}}
/* ---------- Phone layout (window narrower than 640px) ---------- */
@media (max-width:640px){
  html,body{height:auto}
  .app{padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
  .top{padding-block:14px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
  .brand{gap:10px}
  .logo{width:34px;height:34px;font-size:13px;border-radius:9px}
  .brand h1{font-size:19px}
  .brand small{font-size:10px}
  .streak{padding:5px 10px 5px 7px;font-size:14px}
  /* tabs become a bottom app bar */
  .tabs{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:20;margin:0;padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(20,30,60,.08);overflow:visible;gap:0;justify-content:space-around}
  .tab{flex:1 1 0;min-width:0;padding:6px 2px;border:0;border-radius:10px;gap:3px}
  .tab svg{display:block}
  .tab b{font-size:11px;font-weight:700}
  .tab span{display:none}
  .tab[aria-current="page"]{background:var(--accent-soft);box-shadow:none}
  main{gap:14px}
  .panel{padding:16px 14px;border-radius:12px}
  .h2{font-size:22px}
  .stats{grid-template-columns:1fr 1fr;gap:8px}
  .stat{padding:10px 12px}
  .stat b{font-size:24px}
  .row .btn.big{width:100%}
  .btn.big{padding:13px 18px;font-size:16px;flex-direction:column;gap:2px}
  .grid{grid-template-columns:1fr}
  .unit{padding:14px}
  .fc{height:280px}
  .fc-word{font-size:clamp(26px,8vw,36px)}
  .fc-grade{left:10px;right:10px;bottom:10px}
  .fc-grade .btns{gap:8px}
  .fc-grade .btn{padding:9px 4px;font-size:15px}
  .fc-grade .btn small{font-size:11px}
  .prompt{font-size:clamp(24px,7vw,32px)}
  .opt{padding:12px 14px;font-size:17px}
  .summary-nums b{font-size:26px}
  .msg{max-width:92%}
  .footer .row{flex-direction:column;align-items:flex-start}
  .ask{flex-direction:column}
  details .body{padding:0 14px 14px}
  summary{padding:12px 14px;font-size:16px}
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">MC</div>
      <h1>Mi Cuaderno <small>Spanish 1 study notebook</small></h1>
    </div>
    <div class="streak" id="streak" title="Days in a row you studied">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1 4-3 5-3 9a3 3 0 0 0 6 0c0-2-1-3-1-3 3 2 5 4 5 7a7 7 0 0 1-14 0c0-5 5-7 7-13z"/></svg>
      <span id="streakNum">0</span><span style="font-weight:400">días</span>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Sections">
    <button class="tab" data-view="home"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><b>Hoy</b><span>Today</span></button>
    <button class="tab" data-view="cards"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="14" height="12" rx="2"/><path d="M7 7V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-2"/></svg><b>Tarjetas</b><span>Flashcards</span></button>
    <button class="tab" data-view="quiz"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 3 3 5-6"/></svg><b>Prueba</b><span>Quiz</span></button>
    <button class="tab" data-view="verbs"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4l10-10-4-4L4 16z"/><path d="m13 7 4 4"/></svg><b>Verbos</b><span>Verb drill</span></button>
    <button class="tab" data-view="notes"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/><path d="M20 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"/></svg><b>Apuntes</b><span>Grammar notes</span></button>
    <button class="tab" data-view="tutor"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12z"/></svg><b>Tutor</b><span>Ask Claude</span></button>
  </nav>

  <main id="main"></main>
</div>

const KEY='micuaderno.v1';
const INTERVALS=[0,1,3,7,14,30]; // days until a card comes back, by box
let P = {cards:{}, verbs:{r:0,w:0}, days:[], settings:{vosotros:false, dir:'es'}};
try{ const raw=localStorage.getItem(KEY); if(raw){ const o=JSON.parse(raw); P=Object.assign(P,o); P.settings=Object.assign({vosotros:false,dir:'es'},o.settings||{}); } }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(P)); }catch(e){} }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dateStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function markStudied(){ const t=today(); if(!P.days.includes(t)){ P.days.push(t); save(); renderStreak(); } }
function streak(){
  const set=new Set(P.days); let n=0; const d=new Date();
  if(!set.has(dateStr(d))) d.setDate(d.getDate()-1); // streak survives until end of today
  while(set.has(dateStr(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function cardId(u,i){ return u.id+'-'+i; }
function cardById(id){ const k=id.lastIndexOf('-'); const u=UNITS.find(x=>x.id===id.slice(0,k)); return u? {u, c:u.cards[+id.slice(k+1)], id} : null; }
function prog(id){ return P.cards[id]||{b:0,d:0,s:0,r:0}; }
function grade(id,res){
  const c=Object.assign({},prog(id)); c.s++;
  if(res==='got'){ c.b=Math.min(5,c.b+1); c.r++; c.d=Date.now()+INTERVALS[c.b]*864e5; }
  else { c.b = c.b>=3 ? 1 : 0; c.d=Date.now(); } // a slip on a well-known word is a lapse, not a full reset
  P.cards[id]=c; markStudied(); save();
}
function unitMastery(u){ let s=0; u.cards.forEach((c,i)=>{ s+=Math.min(5,prog(cardId(u,i)).b); }); return s/(5*u.cards.length); }
function unitKnown(u){ return u.cards.filter((c,i)=>prog(cardId(u,i)).b>=3).length; }
function dueCards(){ const now=Date.now(); const out=[]; UNITS.forEach(u=>u.cards.forEach((c,i)=>{ const p=prog(cardId(u,i)); if(p.s>0 && p.d<=now) out.push(cardId(u,i)); })); return out; }
function newCardsFrom(u,n){ const out=[]; u.cards.forEach((c,i)=>{ if(prog(cardId(u,i)).s===0 && out.length<n) out.push(cardId(u,i)); }); return out; }
function weakestUnit(){ // first unit that is not fully seen; else lowest mastery
  const unseen=UNITS.find(u=>u.cards.some((c,i)=>prog(cardId(u,i)).s===0)); if(unseen) return unseen;
  return UNITS.slice().sort((a,b)=>unitMastery(a)-unitMastery(b))[0];
}
function buildSession(){
  const due=shuffle(dueCards()).slice(0,20); const ids=due.slice();
  if(ids.length<12){ const u=weakestUnit(); newCardsFrom(u,12-ids.length).forEach(id=>ids.push(id)); }
  return {ids, due:due.length, fresh:ids.length-due.length};
}

function say(t){ if(!canSpeak) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t.replace(/\s*\(.*?\)\s*/g,' ').replace(/…/g,'')); u.lang=esVoice?esVoice.lang:'es-ES'; if(esVoice) u.voice=esVoice; u.rate=0.85; speechSynthesis.speak(u); }catch(e){} }

/* ============================ FLASHCARDS ============================ */
let FC=null;
function startCards(ids,title){ FC={queue:ids.slice(),i:0,flipped:false,missed:[],stats:{got:0,miss:0},title}; go('cards'); }
function renderCards(){

      <div class="summary-nums" style="margin-top:16px"><div class="g"><b>${st.got}</b>thumbs up</div><div class="b"><b>${st.miss}</b>thumbs down</div><div class="w"><b>${uniqMissed.length}</b>words to watch</div></div>
      <div class="row" style="margin-top:18px">
        ${uniqMissed.length?`<button class="btn primary" id="againMissed">Review the ${uniqMissed.length} I missed</button>`:''}
        <button class="btn" id="againAll">Do this set again</button>
        <button class="btn ghost" id="backHome">Back to Hoy</button></div>
      ${uniqMissed.length?`<div class="tbl" style="margin-top:18px"><table><thead><tr><th>Missed</th><th>Meaning</th></tr></thead><tbody>${uniqMissed.map(id=>{const x=cardById(id);return `<tr><td><b class="es">${esc(x.c[0])}</b></td><td>${esc(x.c[1])}</td></tr>`}).join('')}</tbody></table></div>`:''}
    </section>`;
    if($('#againMissed')) $('#againMissed').onclick=()=>startCards(shuffle(uniqMissed),FC.title+' · missed');
    $('#againAll').onclick=()=>startCards(shuffle([...new Set(FC.queue)]),FC.title);
    $('#backHome').onclick=()=>{ FC=null; go('home'); };

  const back= dir==='es'? `<div class="fc-word">${esc(en)}</div><span class="tag n">${esc(x.u.name)}</span>` : `<div class="fc-word" lang="es">${esc(es)}</div>${genderTag(g)}${speakBtn(es)}`;
  main.innerHTML=`<section class="fc-wrap">
    <div class="row between"><span class="eyebrow">${esc(FC.title)}</span>
      <div class="row"><button class="btn ghost" id="dirBtn" title="Switch which side shows first">${dir==='es'?'Español → English':'English → Español'}</button><span class="sub" style="font-variant-numeric:tabular-nums">${FC.i+1} / ${FC.queue.length}</span></div></div>
    <div class="bar"><i style="width:${pct(FC.i/FC.queue.length)}%"></i></div>
    <div class="fc ${FC.flipped?'flipped':''}" id="fc" role="button" tabindex="0" aria-label="Flashcard. Press to flip.">
      <div class="fc-inner">
        <div class="fc-face front">${front}<span class="fc-hint">tap the card to flip · space</span></div>
        <div class="fc-face back">${back}${FC.flipped? `<div class="fc-grade"><span class="lbl">Did you know it?</span><div class="btns">
          <button class="btn bad" data-g="miss">${THUMB_DOWN}<span>No lo sabía <small>missed</small></span><span class="kbd">1 or ←</span></button>
          <button class="btn good" data-g="got">${THUMB_UP}<span>¡Lo sé! <small>got it</small></span><span class="kbd">2 or →</span></button>

  const flip=()=>{ FC.flipped=!FC.flipped; renderCards(); if(FC.flipped&&dir==='en') say(es); };
  const card=$('#fc');
  card.onclick=e=>{ if(e.target.closest('[data-say],[data-g]')) return; flip(); };

  main.querySelectorAll('[data-g]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); gradeCard(b.dataset.g); });
  card.focus({preventScroll:true});
}
function gradeCard(res){
  const id=FC.queue[FC.i]; grade(id,res); FC.stats[res]++;
  if(res==='miss'){ FC.missed.push(id); FC.queue.push(id); }
  FC.i++; FC.flipped=false; renderCards();
}
document.addEventListener('keydown',e=>{
  if(view!=='cards'||!FC||FC.i>=FC.queue.length) return; if(e.target.matches('input,select,textarea')) return;
  const map={'1':'miss','ArrowLeft':'miss','2':'got','ArrowRight':'got'};
  if(FC.flipped&&map[e.key]){ e.preventDefault(); gradeCard(map[e.key]); }
});

/* ============================ QUIZ ============================ */
let Q=null;
function makeQuestion(x,pool){
  const [es,en,g]=x.c; const types=['es2en','en2es']; const single=/^(el|la) [^\/]+$/.test(es); if(single) types.push('art');
  const t=pick(types);
  if(t==='art'){ const noun=es.replace(/^(el|la) /,''); const ans=es.split(' ')[0]; return {type:t,x,prompt:noun,ask:'¿El o la? Which article goes with this noun?',options:[{l:'el',c:ans==='el'},{l:'la',c:ans==='la'}],answer:es}; }
  const others=shuffle(pool.filter(o=>o.id!==x.id && o.c[1]!==en && o.c[0]!==es)).slice(0,3);
  if(t==='es2en'){ const opts=shuffle([{l:en,c:true},...others.map(o=>({l:o.c[1],c:false}))]); return {type:t,x,prompt:es,ask:'What does this mean?',options:opts,answer:en,say:es}; }
  const opts=shuffle([{l:es,c:true},...others.map(o=>({l:o.c[0],c:false}))]); return {type:t,x,prompt:en,ask:'How do you say this in Spanish?',options:opts,answer:es};
}
function startQuiz(unitId){
  let pool=[]; let title='';
  if(unitId==='studied'){ UNITS.forEach(u=>u.cards.forEach((c,i)=>{ const id=cardId(u,i); if(prog(id).s>0) pool.push({id,u,c}); })); title='Everything I have studied'; }
  else { const u=UNITS.find(x=>x.id===unitId); pool=u.cards.map((c,i)=>({id:cardId(u,i),u,c})); title=u.name; }
  if(pool.length<4){ UNITS.slice(0,2).forEach(u=>u.cards.forEach((c,i)=>pool.push({id:cardId(u,i),u,c}))); }
  const n=Math.min(10,pool.length);
  // favor weaker cards: sort by box then shuffle within
  const chosen=shuffle(pool).sort((a,b)=>prog(a.id).b-prog(b.id).b).slice(0,Math.min(pool.length,n*2)); 
  const qs=shuffle(chosen).slice(0,n).map(x=>makeQuestion(x,pool));
  Q={qs,i:0,score:0,answered:null,title}; go('quiz');
}
function renderQuiz(){
  if(!Q){
    main.innerHTML=`<section class="panel"><div class="eyebrow">Prueba · Quiz</div><h2 class="h2">Ten quick questions</h2>
      <p class="sub" style="margin-top:6px">Multiple choice, mixed directions, plus <span class="es">el</span> or <span class="es">la</span> for nouns. Wrong answers get a quick explanation.</p>
      <div class="row" style="margin-top:14px"><select id="qUnit" aria-label="Choose a unit"><option value="studied">Everything I have studied</option>${UNITS.map(u=>`<option value="${u.id}">${esc(u.name)} · ${esc(u.en)}</option>`).join('')}</select>
      <button class="btn primary" id="qStart">Empezar <small>start</small></button></div></section>`;
    $('#qStart').onclick=()=>startQuiz($('#qUnit').value); return;
  }
  if(Q.i>=Q.qs.length){
    const s=Q.score,n=Q.qs.length; const msg= s===n?'¡Perfecto! 100%.': s>=n*0.8?'¡Excelente! You are getting this.': s>=n*0.6?'¡Bien! A few more rounds and this unit is yours.':'Good start. Review these words with flashcards, then try again.';
    main.innerHTML=`<section class="panel lift"><div class="eyebrow">${esc(Q.title)}</div><h2 class="h2">${s} / ${n} · ${msg}</h2>
      <div class="row" style="margin-top:18px"><button class="btn primary" id="qAgain">Try again</button><button class="btn" id="qCards">Flashcards for the ones I missed</button><button class="btn ghost" id="qHome">Back to Hoy</button></div></section>`;
    $('#qAgain').onclick=()=>startQuiz(Q.unitId||'studied'); $('#qHome').onclick=()=>{ Q=null; go('home'); };
    $('#qCards').onclick=()=>{ const ids=[...new Set(Q.qs.filter(q=>q.wrong).map(q=>q.x.id))]; if(!ids.length){ alert('You missed nothing!'); return; } startCards(ids,Q.title+' · missed'); };
    return;
  }
  const q=Q.qs[Q.i]; const letters='ABCD';
  main.innerHTML=`<section class="panel lift">
    <div class="row between"><span class="eyebrow">${esc(Q.title)}</span><span class="sub" style="font-variant-numeric:tabular-nums">${Q.i+1} / ${Q.qs.length} · ${Q.score} right</span></div>
    <div class="bar" style="margin:10px 0 18px"><i style="width:${pct(Q.i/Q.qs.length)}%"></i></div>
    <div class="eyebrow">${q.ask}</div>
    <div class="row" style="margin:6px 0 18px"><div class="prompt" ${q.type!=='en2es'?'lang="es"':''}>${esc(q.prompt)}</div>${q.say?speakBtn(q.say):''}</div>
    <div class="opts">${q.options.map((o,i)=>{ let cls=''; if(Q.answered!==null){ if(o.c) cls='right'; else if(i===Q.answered) cls='wrong'; } return `<button class="opt ${cls}" data-i="${i}" ${Q.answered!==null?'disabled':''}><span class="k">${letters[i]}</span><span ${q.type!=='es2en'?'lang="es"':''}>${esc(o.l)}</span></button>`; }).join('')}</div>
    <div id="qFeed" style="margin-top:14px"></div>
  </section>`;
  main.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  if(Q.answered!==null){
    const o=q.options[Q.answered]; const right=o.c; const [es,en,g]=q.x.c;
    let expl='';
    if(!right){
      if(q.type==='art') expl=`Explain to a Spanish 1 student why the noun "${q.prompt}" uses "${q.answer.split(' ')[0]}" (${q.answer} = ${en}). Mention the common ending rule (-o masculine, -a feminine) and whether this word follows it or is an exception. 2-3 short sentences.`;
      else expl=`A Spanish 1 student thought "${es}" meant "${q.type==='es2en'?o.l:q.prompt}" but "${es}" means "${en}"${q.type==='en2es'?` (they chose "${o.l}" instead)`:''}. In 2-3 short sentences give a memory trick for "${es}" and one simple example sentence with its English meaning.`;
    }
    $('#qFeed').innerHTML=`<div class="feedback ${right?'good':'bad'}"><b>${right?'¡Correcto!':'Not quite.'}</b><span class="ink">${right?'':`The answer is <b class="es" lang="es">${esc(q.answer)}</b>. `}<span lang="es" class="es">${esc(es)}</span> = ${esc(en)}</span>${right?'':explainBox(expl)}</div>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="qNext">${Q.i+1<Q.qs.length?'Siguiente <small>next · enter</small>':'See my score'}</button></div>`;
    $('#qNext').onclick=()=>{ Q.i++; Q.answered=null; renderQuiz(); }; $('#qNext').focus();
  }
}
function answer(i){ if(Q.answered!==null) return; const q=Q.qs[Q.i]; Q.answered=i; const right=q.options[i].c; if(right){ Q.score++; grade(q.x.id,'got'); } else { q.wrong=true; grade(q.x.id,'miss'); } if(q.type!=='en2es'||right) say(q.x.c[0]); renderQuiz(); }
document.addEventListener('keydown',e=>{ if(view!=='quiz'||!Q||Q.i>=Q.qs.length||Q.answered!==null) return; if(e.target.matches('input,select,textarea')) return; const k=e.key.toUpperCase(); const i='ABCD'.indexOf(k); if(i>=0&&i<Q.qs[Q.i].options.length) answer(i); else if(['1','2','3','4'].includes(e.key)&&(+e.key)<=Q.qs[Q.i].options.length) answer(+e.key-1); });

/* ============================ VERB DRILL ============================ */
let V={group:'ar',cur:null,state:'ask',right:0,total:0,run:0,last:null};
function nextVerb(){ const g=VERB_GROUPS.find(x=>x.id===V.group); const vs=VERBS.filter(g.f); const v=pick(vs); const idx=[0,1,2,3,5].concat(P.settings.vosotros?[4]:[]); let pi=pick(idx); if(V.cur&&V.cur.v===v&&V.cur.pi===pi) pi=pick(idx.filter(i=>i!==pi)); V.cur={v,pi}; V.state='ask'; }
function verbTable(v,hi){ const f=conj(v); return `<div class="tbl"><table><thead><tr><th>${esc(v.inf)} · ${esc(v.en)}</th><th></th></tr></thead><tbody>${PRON.map((p,i)=>(i===4&&!P.settings.vosotros)?'':`<tr><td>${esc(p)}<br><span class="sub" style="font-size:12px">${esc(PRON_EN[i])}</span></td><td class="${i===hi?'hl':''}"><b class="es" lang="es">${esc(f[i])}</b></td></tr>`).join('')}</tbody></table></div>`; }
function renderVerbs(){
  if(!V.cur) nextVerb();
  const {v,pi}=V.cur; const target=conj(v)[pi];
  const acc=V.total?pct(V.right/V.total)+'%':'—';
  let body='';
  if(V.state==='ask'){
    body=`<div class="eyebrow">Conjugate in the present tense</div>
      <div class="row" style="margin:6px 0 4px"><div class="prompt" lang="es">${esc(PRON[pi])} <span style="color:var(--muted);font-weight:500">+</span> ${esc(v.inf)}</div></div>
      <p class="sub">${esc(v.inf)} = ${esc(v.en)} · ${esc(PRON_EN[pi])}${v.type==='irr'?' · <b>irregular</b>':' · regular -'+v.type}</p>
      <form id="vForm" style="margin-top:16px;display:flex;flex-direction:column;gap:12px" autocomplete="off">
        <input type="text" id="vIn" lang="es" placeholder="Type the verb form…" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Your answer">
        ${accentKeys()}
        <div class="row"><button class="btn primary" type="submit">Comprobar <small>check · enter</small></button><button class="btn ghost" type="button" id="vShow">Show me the table</button></div>
      </form>`;
  } else {
    const r=V.last; const cls=r.kind==='right'?'good':r.kind==='accent'?'warn':'bad';
    const head=r.kind==='right'?'¡Correcto!':r.kind==='accent'?'Almost! Just the accent.':'Not quite.';
    const rule= v.type==='irr'? `<span class="ink">${esc(v.inf)} is irregular. This is one to memorize, so say the whole table out loud once.</span>`
      : `<span class="ink">Regular -${v.type} verb: drop <b>-${v.type}</b> from <b lang="es">${esc(v.inf)}</b> to get the stem <b lang="es">${esc(v.inf.slice(0,-2))}-</b>, then add the <b>${esc(PRON[pi])}</b> ending <b>-${esc(ENDINGS[v.type][pi])}</b>.</span>`;
    const expl=`A Spanish 1 student was asked to conjugate "${v.inf}" (${v.en}) for "${PRON[pi]}" and wrote "${r.ans||'(nothing)'}". The correct form is "${target}". In 3 short sentences, explain the rule and give a memory trick.`;
    body=`<div class="feedback ${cls}"><b>${head}</b><span class="ink" style="font-size:20px"><span lang="es">${esc(PRON[pi])}</span> <b class="es" lang="es">${esc(target)}</b> ${speakBtn(PRON[pi].split(' / ')[0]+' '+target)}</span>${r.kind!=='right'&&r.ans?`<span>You wrote: <s>${esc(r.ans)}</s></span>`:''}${rule}${r.kind==='wrong'?explainBox(expl):''}</div>
      ${r.kind!=='right'||r.show?verbTable(v,pi):''}
      <div class="row" style="margin-top:14px"><button class="btn primary" id="vNext">Siguiente <small>next · enter</small></button></div>`;
  }
  main.innerHTML=`<section class="panel lift">
    <div class="row between"><div class="row"><span class="eyebrow">Verbos · Verb drill</span><select id="vGroup" aria-label="Verb set">${VERB_GROUPS.map(g=>`<option value="${g.id}" ${g.id===V.group?'selected':''}>${esc(g.label)}</option>`).join('')}</select></div>
      <span class="sub" style="font-variant-numeric:tabular-nums">${V.right} / ${V.total} · ${acc}${V.run>=3?' · '+V.run+' in a row':''}</span></div>
    <div style="margin-top:16px">${body}</div>
  </section>
  <section class="panel"><div class="eyebrow">Endings cheat sheet</div>
    <div class="tbl" style="margin-top:8px"><table><thead><tr><th></th><th>-ar</th><th>-er</th><th>-ir</th></tr></thead><tbody>
    ${PRON.map((p,i)=>(i===4&&!P.settings.vosotros)?'':`<tr><td>${esc(p)}</td><td><b class="es">-${ENDINGS.ar[i]}</b></td><td><b class="es">-${ENDINGS.er[i]}</b></td><td><b class="es">-${ENDINGS.ir[i]}</b></td></tr>`).join('')}
    </tbody></table></div>
    <p class="tip" style="margin-top:12px">Notice: -er and -ir endings are the same except for <span class="es">nosotros</span> (-emos / -imos)${P.settings.vosotros?' and <span class="es">vosotros</span> (-éis / -ís)':''}.</p>
  </section>`;
  $('#vGroup').onchange=e=>{ V.group=e.target.value; V.cur=null; nextVerb(); renderVerbs(); };
  if(V.state==='ask'){
    const inp=$('#vIn'); inp.focus(); lastInput=inp;
    $('#vForm').onsubmit=e=>{ e.preventDefault(); checkVerb(inp.value); };
    $('#vShow').onclick=()=>{ V.last={kind:'wrong',ans:'',show:true}; V.state='done'; V.total++; P.verbs.w++; save(); markStudied(); V.run=0; renderVerbs(); };
  } else { const nb=$('#vNext'); nb.focus(); nb.onclick=()=>{ nextVerb(); renderVerbs(); }; }
}
function checkVerb(ans){
  const {v,pi}=V.cur; const target=conj(v)[pi]; let kind='wrong';
  if(exact(ans)===exact(target)) kind='right'; else if(norm(ans)===norm(target)) kind='accent';
  V.total++; if(kind==='right'){ V.right++; V.run++; P.verbs.r++; } else if(kind==='accent'){ V.right++; V.run++; P.verbs.r++; } else { V.run=0; P.verbs.w++; }
  save(); markStudied(); V.last={kind,ans:ans.trim()}; V.state='done'; say(PRON[pi].split(' / ')[0]+' '+target); renderVerbs();
}

/* ============================ NOTES ============================ */
function renderNotes(){
  const t=(rows)=>`<div class="tbl"><table>${rows}</table></div>`;
  main.innerHTML=`<section class="panel"><div class="eyebrow">Apuntes · Grammar notes</div><h2 class="h2">The rules you need for Spanish 1</h2><p class="sub" style="margin-top:6px">Short, in plain English. Open one, read it, then go drill it.</p></section>
  <div>
  <details open><summary>Subject pronouns (who is doing it)</summary><div class="body">
    ${t(`<thead><tr><th>Spanish</th><th>English</th></tr></thead><tbody>${PRON.map((p,i)=>`<tr><td><b class="es">${p}</b></td><td>${PRON_EN[i]}</td></tr>`).join('')}</tbody></table>`)}
    <p><span class="es">tú</span> is for a friend or family member. <span class="es">usted</span> is for a teacher, a stranger, or an adult you respect. <span class="es">vosotros</span> is only used in Spain, so most US classes skip it.</p>
    <p class="tip">Spanish often drops the pronoun because the verb ending already tells you who. <span class="es">Hablo español</span> = I speak Spanish.</p>
  </div></details>
  <details><summary>Regular present tense: -ar, -er, -ir</summary><div class="body">
    <p>Take off the last two letters to get the stem, then add the ending for the person.</p>
    ${t(`<thead><tr><th></th><th>hablar</th><th>comer</th><th>vivir</th></tr></thead><tbody>${PRON.map((p,i)=>`<tr><td>${p}</td><td><b class="es">habl${ENDINGS.ar[i]}</b></td><td><b class="es">com${ENDINGS.er[i]}</b></td><td><b class="es">viv${ENDINGS.ir[i]}</b></td></tr>`).join('')}</tbody>`)}
    <p><span class="es">Yo</span> always ends in <b>-o</b>. <span class="es">Tú</span> always ends in <b>-s</b>. <span class="es">Nosotros</span> always ends in <b>-mos</b>. <span class="es">Ellos</span> always ends in <b>-n</b>.</p>
  </div></details>
  <details><summary>Ser vs. estar (the two "to be" verbs)</summary><div class="body">
    ${t(`<thead><tr><th></th><th>ser</th><th>estar</th></tr></thead><tbody>${PRON.map((p,i)=>`<tr><td>${p}</td><td><b class="es">${conj(VERBS.find(v=>v.inf==='ser'))[i]}</b></td><td><b class="es">${conj(VERBS.find(v=>v.inf==='estar'))[i]}</b></td></tr>`).join('')}</tbody>`)}
    <p><b>SER</b> is for what something <i>is</i>. Remember <b>DOCTOR</b>: Description, Occupation, Characteristic, Time/date, Origin, Relationship. <span class="es">Soy alta. Es lunes. Somos de Texas.</span></p>
    <p><b>ESTAR</b> is for how or where something is right now. Remember <b>PLACE</b>: Position, Location, Action (-ando/-iendo), Condition, Emotion. <span class="es">Estoy cansado. Está en la biblioteca.</span></p>
    <p class="tip">Quick test: could it change by tomorrow? Then it is probably <span class="es">estar</span>. <span class="es">Estoy triste</span> (today) vs. <span class="es">Soy serio</span> (my personality).</p>
  </div></details>
  <details><summary>Tener, ir, and hacer</summary><div class="body">
    ${t(`<thead><tr><th></th><th>tener</th><th>ir</th><th>hacer</th></tr></thead><tbody>${PRON.map((p,i)=>`<tr><td>${p}</td><td><b class="es">${conj(VERBS.find(v=>v.inf==='tener'))[i]}</b></td><td><b class="es">${conj(VERBS.find(v=>v.inf==='ir'))[i]}</b></td><td><b class="es">${conj(VERBS.find(v=>v.inf==='hacer'))[i]}</b></td></tr>`).join('')}</tbody>`)}
    <p><b>Tener expressions</b> use "have" where English uses "am": <span class="es">tengo hambre</span> (I am hungry), <span class="es">tengo sed</span> (thirsty), <span class="es">tengo frío</span> (cold), <span class="es">tengo quince años</span> (I am 15), <span class="es">tengo que estudiar</span> (I have to study).</p>
    <p><b>Ir a + place</b> = going somewhere: <span class="es">Voy a la playa.</span> <b>Ir a + infinitive</b> = going to do something: <span class="es">Voy a estudiar.</span> Note <span class="es">a + el = al</span>: <span class="es">Voy al cine.</span></p>
  </div></details>
  <details><summary>Gustar (to like)</summary><div class="body">
    <p>Gustar literally means "to be pleasing to". So you say "to me is pleasing the pizza". You only need two forms in Spanish 1:</p>
    <ul><li><b class="es">gusta</b> with ONE thing or with an activity (verb): <span class="es">Me gusta la pizza. Me gusta bailar.</span></li>
    <li><b class="es">gustan</b> with MORE THAN ONE thing: <span class="es">Me gustan los perros.</span></li></ul>
    ${t(`<thead><tr><th>Who likes it</th><th>Spanish</th></tr></thead><tbody><tr><td>I</td><td><b class="es">me</b> gusta(n)</td></tr><tr><td>you</td><td><b class="es">te</b> gusta(n)</td></tr><tr><td>he / she / you formal</td><td><b class="es">le</b> gusta(n)</td></tr><tr><td>we</td><td><b class="es">nos</b> gusta(n)</td></tr><tr><td>they / you all</td><td><b class="es">les</b> gusta(n)</td></tr></tbody>`)}
    <p>To say who, add <span class="es">a</span>: <span class="es">A Marta le gusta leer.</span> To say no: <span class="es">No me gusta.</span></p>
  </div></details>
  <details><summary>Nouns, gender, and el / la / un / una</summary><div class="body">
    <p>Every noun is masculine or feminine, even objects. Words ending in <b>-o</b> are usually masculine (<span class="es">el libro</span>). Words ending in <b>-a</b> are usually feminine (<span class="es">la mesa</span>). Also feminine: <b>-ción, -dad</b> (<span class="es">la estación, la ciudad</span>).</p>
    ${t(`<thead><tr><th></th><th>the (one)</th><th>the (many)</th><th>a / an</th><th>some</th></tr></thead><tbody><tr><td>masculine</td><td><b class="es">el</b> libro</td><td><b class="es">los</b> libros</td><td><b class="es">un</b> libro</td><td><b class="es">unos</b> libros</td></tr><tr><td>feminine</td><td><b class="es">la</b> mesa</td><td><b class="es">las</b> mesas</td><td><b class="es">una</b> mesa</td><td><b class="es">unas</b> mesas</td></tr></tbody>`)}
    <p><b>Exceptions to learn:</b> <span class="es">el día, el mapa, el problema, la mano, la foto</span>, and <span class="es">el agua</span> (feminine, but uses <span class="es">el</span> because of the "a" sound).</p>
    <p><b>Plurals:</b> ends in a vowel, add <b>-s</b> (<span class="es">libros</span>). Ends in a consonant, add <b>-es</b> (<span class="es">papeles</span>). A <b>-z</b> becomes <b>-ces</b> (<span class="es">lápiz → lápices</span>).</p>
  </div></details>
  <details><summary>Adjectives must agree</summary><div class="body">
    <p>Adjectives match the noun in gender AND number, and usually come <b>after</b> the noun.</p>
    ${t(`<tbody><tr><td>el chico alt<b>o</b></td><td>los chicos alt<b>os</b></td></tr><tr><td>la chica alt<b>a</b></td><td>las chicas alt<b>as</b></td></tr><tr><td>el libro interesant<b>e</b></td><td>los libros interesant<b>es</b></td></tr></tbody>`)}
    <p>Adjectives ending in <b>-e</b> or a consonant (<span class="es">inteligente, joven, fácil</span>) do not change for gender, only for number. A mixed group of boys and girls uses the masculine plural: <span class="es">Ana y Luis son simpáticos.</span></p>
  </div></details>
  <details><summary>Asking questions</summary><div class="body">
    <p>Question words always have an accent mark and the sentence starts with <span class="es">¿</span>.</p>
    ${t(`<tbody><tr><td><b class="es">¿Qué?</b></td><td>What?</td><td><span class="es">¿Qué es esto?</span></td></tr><tr><td><b class="es">¿Quién?</b></td><td>Who?</td><td><span class="es">¿Quién es ella?</span></td></tr><tr><td><b class="es">¿Dónde?</b></td><td>Where?</td><td><span class="es">¿Dónde está el baño?</span></td></tr><tr><td><b class="es">¿Cuándo?</b></td><td>When?</td><td><span class="es">¿Cuándo es la fiesta?</span></td></tr><tr><td><b class="es">¿Por qué?</b></td><td>Why?</td><td><span class="es">¿Por qué estudias?</span> — <span class="es">Porque…</span></td></tr><tr><td><b class="es">¿Cómo?</b></td><td>How?</td><td><span class="es">¿Cómo estás?</span></td></tr><tr><td><b class="es">¿Cuánto/a?</b> / <b class="es">¿Cuántos/as?</b></td><td>How much / many?</td><td><span class="es">¿Cuántos años tienes?</span></td></tr><tr><td><b class="es">¿Cuál?</b></td><td>Which?</td><td><span class="es">¿Cuál es tu clase favorita?</span></td></tr></tbody>`)}
    <p>Yes/no questions: just raise your voice at the end, or flip the order. <span class="es">¿Hablas español?</span> = Do you speak Spanish?</p>
  </div></details>
  <details><summary>Numbers 0–100: the patterns</summary><div class="body">
    <ul><li><b>0–15</b> you just memorize: cero, uno, dos, tres, cuatro, cinco, seis, siete, ocho, nueve, diez, once, doce, trece, catorce, quince.</li>
    <li><b>16–19</b> = <span class="es">dieci</span> + number: <span class="es">dieciséis, diecisiete, dieciocho, diecinueve</span>.</li>
    <li><b>21–29</b> = <span class="es">veinti</span> + number: <span class="es">veintiuno, veintidós, veintitrés…</span></li>
    <li><b>31 and up</b> = tens + <span class="es">y</span> + ones: <span class="es">treinta y uno, cuarenta y cinco, noventa y nueve</span>.</li>
    <li>Tens: <span class="es">diez, veinte, treinta, cuarenta, cincuenta, sesenta, setenta, ochenta, noventa, cien</span>. Most end in <b>-enta</b>.</li></ul>
  </div></details>
  <details><summary>Telling time</summary><div class="body">
    <p><span class="es">¿Qué hora es?</span> = What time is it?</p>
    <ul><li>1:00 → <span class="es">Es la una.</span> (only one o'clock uses <span class="es">es la</span>)</li>
    <li>2:00 and up → <span class="es">Son las dos. Son las diez.</span></li>
    <li>:15 → <span class="es">y cuarto</span> · :30 → <span class="es">y media</span> · :45 → next hour <span class="es">menos cuarto</span> (<span class="es">Son las tres menos cuarto</span> = 2:45)</li>
    <li>Other minutes → <span class="es">y</span> + number: <span class="es">Son las cuatro y diez.</span></li>
    <li>a.m. → <span class="es">de la mañana</span> · afternoon → <span class="es">de la tarde</span> · night → <span class="es">de la noche</span></li>
    <li>"At" a time → <span class="es">a la una / a las dos</span>: <span class="es">La clase es a las ocho.</span></li></ul>
  </div></details>
  <details><summary>Study tips for catching up</summary><div class="body">
    <ul><li><b>Ten minutes every day</b> beats an hour once a week. Tap "Start today's session" and just do the cards it gives you.</li>
    <li><b>Say it out loud.</b> Use the speaker button, copy the sound, then say it before you flip. Your mouth remembers too.</li>
    <li><b>Be honest with the thumbs.</b> Thumbs down is not failing. It brings the word back in a minute, and again tomorrow, which is exactly how it sticks.</li>
    <li><b>Learn nouns with their article.</b> Always <span class="es">la mesa</span>, never just <span class="es">mesa</span>. Then el/la is free.</li>
    <li><b>Verbs: know the endings first.</b> Once -o, -as, -a, -amos, -an is automatic, every regular verb is easy.</li>
    <li><b>Ask the tutor</b> when a rule does not click. There are no dumb questions in there.</li></ul>
  </div></details>
  </div>`;
}

/* ============================ TUTOR ============================ */
let T={turns:[],busy:false,ctl:null};
function renderTutor(){
  const hasClaude = !!(window.claude && typeof window.claude.use==='function');
  if(!sampleFn){
    main.innerHTML=`<section class="panel"><div class="eyebrow">Tutor · Ask Claude</div><h2 class="h2">Your own Spanish tutor</h2>
      <p class="sub" style="margin-top:8px;max-width:60ch">${hasClaude?'Connecting to Claude… If this does not change in a few seconds, the tutor is not available in this view.':'The tutor works when you open this page from claude.ai. Everything else works right here, including the grammar notes in Apuntes.'}</p></section>`;
    return;
  }
  const starters=['Explain ser vs estar like I am 14','Quiz me on numbers 1 to 30','How do I say "I like to dance with my friends"?','What is the difference between tú and usted?','Give me 5 sentences using tener'];
  main.innerHTML=`<section class="panel lift"><div class="row between"><div><div class="eyebrow">Tutor · Ask Claude</div><h2 class="h3">Ask anything about Spanish 1</h2></div>${T.turns.length?'<button class="btn ghost" id="tClear">Clear chat</button>':''}</div>
    <div class="chat" id="chat" style="margin-top:14px">${T.turns.length?'':'<p class="sub">Stuck on a rule? Want a mini quiz? Type it below, in English or Spanish.</p>'}${T.turns.map(t=>`<div class="msg ${t.role==='user'?'me':'ai'}">${esc(t.content)}</div>`).join('')}${T.busy?'<div class="msg ai thinking" id="live">Thinking…</div>':''}</div>
    ${T.turns.length?'':`<div class="chips" style="margin-top:12px">${starters.map(s=>`<button class="chip" data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div>`}
    <form class="ask" id="askForm" style="margin-top:14px"><input type="text" id="askIn" placeholder="Type your question…" aria-label="Your question" ${T.busy?'disabled':''}>${T.busy?'<button class="btn" type="button" id="stopBtn">Stop</button>':'<button class="btn primary" type="submit">Enviar <small>send</small></button>'}</form>
    <p class="sub" style="font-size:13px;margin-top:8px">The tutor uses your Claude account. It only sees this chat, not your progress.</p>
  </section>`;
  main.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>ask(b.dataset.q));
  $('#askForm').onsubmit=e=>{ e.preventDefault(); const v=$('#askIn').value.trim(); if(v) ask(v); };
  if($('#stopBtn')) $('#stopBtn').onclick=()=>T.ctl&&T.ctl.abort();
  if($('#tClear')) $('#tClear').onclick=()=>{ T.turns=[]; renderTutor(); };
  if(!T.busy){ const i=$('#askIn'); i.focus(); }
  const c=$('#chat'); c.scrollTop=c.scrollHeight;
}
async function ask(q){
  if(T.busy||!sampleFn) return; T.turns.push({role:'user',content:q}); T.busy=true; T.ctl=new AbortController(); renderTutor();
  const input=[{role:'user',content:TUTOR_RULES},...T.turns.slice(-12)];
  let text='';
  try{
    const r=await sampleFn(input,{cache:false,signal:T.ctl.signal,onText:({text:t})=>{ text=t; const l=document.getElementById('live'); if(l){ l.classList.remove('thinking'); l.textContent=t; } }});
    text=r.text;
  }catch(e){ text=(e&&e.text)? e.text : tutorErr(e); if(e&&(e.code==='not_granted'||e.code==='sampling_disabled')){ sampleFn=null; } }
  T.busy=false; T.ctl=null; if(text) T.turns.push({role:'assistant',content:text}); renderTutor();
}

/* ============================ BOOT ============================ */
// Outside the claude.ai viewer there is no tutor, so hide that tab entirely.
if(!(window.claude&&typeof window.claude.use==='function')){ const tt=document.querySelector('.tab[data-view="tutor"]'); if(tt) tt.hidden=true; if(view==='tutor') view='home'; }
render();
</script>
