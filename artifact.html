<title>Mi Cuaderno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#E9EDF3; --ink:#1B2030; --muted:#5D6579; --line:#D5DBE5;
  --accent:#1E5AA8; --accent-ink:#FFFFFF; --accent-soft:#E1EAF7;
  --sun:#F2B134; --sun-soft:#FBEBC7; --sun-ink:#4A3200;
  --good:#23845A; --good-soft:#DCF2E6; --warn:#A8730A; --warn-soft:#FBEFD0; --bad:#BE2F3D; --bad-soft:#F9E0E3;
  --masc:#2A66C4; --fem:#B9457A;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 8px 24px rgba(20,30,60,.08);
  --radius:14px;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141C; --surface:#1A1F2B; --surface-2:#232937; --ink:#ECEEF4; --muted:#A4ABBC; --line:#333B4E;
    --accent:#79A9F0; --accent-ink:#0E1B31; --accent-soft:#1E2B45;
    --sun:#F2B134; --sun-soft:#3B3220; --sun-ink:#FBE3A6;
    --good:#5FC792; --good-soft:#1B3428; --warn:#E6B44B; --warn-soft:#3A3120; --bad:#F27C86; --bad-soft:#3E2025;
    --masc:#86B0F2; --fem:#EA92B7;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#11141C; --surface:#1A1F2B; --surface-2:#232937; --ink:#ECEEF4; --muted:#A4ABBC; --line:#333B4E;
  --accent:#79A9F0; --accent-ink:#0E1B31; --accent-soft:#1E2B45;
  --sun:#F2B134; --sun-soft:#3B3220; --sun-ink:#FBE3A6;
  --good:#5FC792; --good-soft:#1B3428; --warn:#E6B44B; --warn-soft:#3A3120; --bad:#F27C86; --bad-soft:#3E2025;
  --masc:#86B0F2; --fem:#EA92B7;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
.app{max-width:920px;margin:0 auto;padding-inline:16px;padding-block:0 48px;min-height:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 8px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.02em}
.brand h1{font-size:24px;font-weight:700}
.brand small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:400}
.streak{display:flex;align-items:center;gap:8px;background:var(--sun-soft);color:var(--sun-ink);border-radius:999px;padding:6px 12px 6px 8px;font-weight:700;font-variant-numeric:tabular-nums}
.streak svg{color:var(--sun)}
.top-r{display:flex;align-items:center;gap:8px}
.ao-toggle{display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px 6px 9px;font-weight:700;font-size:14px}
.ao-toggle:hover{background:var(--surface-2)}
.ao-toggle[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ao-toggle:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:8px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:1px solid transparent;background:transparent;border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:88px;color:var(--muted);line-height:1.2}
.tab svg{display:none}
.tab b{font-family:var(--display);font-weight:700;font-size:15px;color:var(--ink)}
.tab span{font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.tab[aria-current="page"]{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow);color:var(--accent)}
.tab[aria-current="page"] b{color:var(--accent)}
main{display:flex;flex-direction:column;gap:20px}
main>*,.panel,.row,.stats,.grid{min-width:0}
.row>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.panel.lift{box-shadow:var(--shadow)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.h2{font-size:26px;font-weight:700}
.h3{font-size:19px;font-weight:700}
.sub{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .08s ease,background .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.big{padding:14px 22px;font-size:17px;border-radius:12px}
.btn.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.btn.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.btn.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn small{font-weight:400;font-size:12px;opacity:.8}
.unit{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.unit h3{font-size:18px}
.unit .en{color:var(--muted);font-size:14px}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s ease}
.bar.sun i{background:var(--sun)}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.unit .row{margin-top:auto}
.unit .row{flex-wrap:nowrap}
.unit .btn{flex:1;padding:8px 10px;font-size:14px}
select,input[type=text]{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px}
input[type=text]{font-size:20px;width:100%}
label.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
label.check input{width:18px;height:18px;accent-color:var(--accent)}
.fc-wrap{display:flex;flex-direction:column;gap:14px}
.fc{position:relative;height:300px;perspective:1200px;cursor:pointer;border:0;background:transparent;padding:0;width:100%;text-align:center}
.fc-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:28px 24px;border:1px solid var(--line);box-shadow:var(--shadow)}
.fc-face.front{background:var(--surface)}
.fc-face.back{background:var(--accent-soft);transform:rotateY(180deg);padding-bottom:124px}
.fc-word{font-family:var(--display);font-size:clamp(28px,6vw,44px);font-weight:700;line-height:1.1;text-wrap:balance}
.fc-hint{position:absolute;bottom:14px;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.04em}
.tag.m{background:var(--accent-soft);color:var(--masc)}
.tag.f{background:var(--bad-soft);color:var(--fem)}
.tag.n{background:var(--surface-2);color:var(--muted)}
.speak{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;display:inline-grid;place-items:center;color:var(--accent)}
.speak:hover{background:var(--accent-soft)}
.speak.sm{width:26px;height:26px;vertical-align:middle;margin:0 2px 0 4px;flex:none}
.speak.sm svg{width:15px;height:15px}
.fc-grade{position:absolute;left:14px;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px}
.fc-grade .lbl{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;text-align:center}
.fc-grade .btns{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.fc-grade .btn{flex-direction:column;gap:3px;padding:10px 6px;line-height:1.2;font-size:16px}
.fc-grade .btn svg{width:26px;height:26px}
.fc-grade .btn small{display:block}
.kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;opacity:.7}
/* keyboard hints mean nothing on a touch screen */
@media (hover:none) and (pointer:coarse){.kbd,.khint{display:none}}
.opts{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:560px){.opts{grid-template-columns:1fr 1fr}}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;font-size:18px;display:flex;gap:12px;align-items:center}
.opt:hover{background:var(--surface-2)}
.opt .k{width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted);flex:none}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.prompt{font-family:var(--display);font-size:clamp(26px,5vw,38px);font-weight:700;line-height:1.15}
.feedback{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.feedback.good{background:var(--good-soft);color:var(--good)}
.feedback.warn{background:var(--warn-soft);color:var(--warn)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback b{font-family:var(--display);font-size:18px}
.feedback .ink{color:var(--ink)}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;line-height:1.1}
.seg button small{font-weight:400;font-size:11px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.build{display:flex;align-items:baseline;gap:2px;margin-top:14px;font-family:var(--display);font-size:clamp(32px,7vw,48px);font-weight:700;line-height:1.1}
.build .slot{display:inline-block;min-width:1.8em;border-bottom:4px dashed var(--accent);color:var(--accent)}
.chips-lg{display:flex;gap:10px;flex-wrap:wrap}
.chip-lg{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 18px;font-size:22px;font-weight:700;font-family:var(--display);display:inline-flex;gap:8px;align-items:baseline;min-width:76px;justify-content:center;white-space:nowrap;transition:transform .08s}
.chip-lg:hover{background:var(--accent-soft);border-color:var(--accent)}
.chip-lg:active{transform:translateY(1px)}
.optx{margin-top:14px}
.optx ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.optx li{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.optx li.correct{background:var(--good-soft);border-color:var(--good)}
.optx li.picked:not(.correct){background:var(--bad-soft);border-color:var(--bad)}
.optx .ch{font-family:var(--display);font-weight:700;font-size:20px;min-width:3em}
.optx .hint{grid-column:2;font-size:13px;color:var(--muted)}
.tag.good{background:var(--good);color:#fff}
.tag.bad{background:var(--bad);color:#fff}
.practice{margin-top:4px;padding-top:12px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:8px}
.practice .btn{padding:8px 12px;font-size:14px}
.key{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;min-width:40px;height:40px;font-size:18px;font-weight:700}
.key:hover{background:var(--accent-soft)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.hl{background:var(--sun-soft);color:var(--sun-ink);font-weight:700;border-radius:6px}
td b.es{color:var(--accent)}
details{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
details+details{margin-top:10px}
summary{cursor:pointer;padding:14px 18px;font-family:var(--display);font-weight:700;font-size:17px;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--muted);font-size:20px;font-weight:500}
details[open] summary::after{content:"–"}
details .body{padding:0 18px 18px;display:flex;flex-direction:column;gap:12px;max-width:68ch}
details .body p,details .body li{line-height:1.55}
details ul{margin:0;padding-left:20px}
.es{color:var(--accent);font-weight:700}
.tip{background:var(--sun-soft);color:var(--sun-ink);border-radius:10px;padding:10px 14px;font-size:15px}
.chat{display:flex;flex-direction:column;gap:10px;min-height:200px}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;line-height:1.5}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.msg.ai.thinking{color:var(--muted);font-style:italic}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px}
.chip:hover{background:var(--accent-soft)}
.ask{display:flex;gap:8px}
.ask input{flex:1;font-size:16px}
.explain{margin-top:8px}
.explain p{color:var(--ink);white-space:pre-wrap;margin-top:8px;line-height:1.55}
.summary-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.summary-nums div{border-radius:12px;padding:14px 8px}
.summary-nums b{display:block;font-family:var(--display);font-size:32px;font-variant-numeric:tabular-nums}
.summary-nums .g{background:var(--good-soft);color:var(--good)}
.summary-nums .w{background:var(--warn-soft);color:var(--warn)}
.summary-nums .b{background:var(--bad-soft);color:var(--bad)}
.footer{color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:10px}
.footer .btn{padding:8px 12px;font-size:14px}
.warnText{color:var(--warn);font-weight:700}
.bk{display:flex;flex-direction:column;gap:10px;background:var(--surface-2);border-radius:12px;padding:14px;color:var(--ink)}
.bk textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:10px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface);color:var(--ink);resize:vertical;word-break:break-all}
.sr{position:absolute;left:-9999px}
.tab b.sm{display:none}
.talk-log{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.msg .who{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;opacity:.75;margin-bottom:2px}
.msg .line{font-size:18px;font-weight:700}
.msg .tr{display:block;font-size:14px;opacity:.8;margin-top:2px}
.msg .hid{font-style:italic;color:var(--muted)}
.msg.me .speak{margin-left:6px}
.msg.now{outline:2px solid var(--accent);outline-offset:2px}
.talk-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.talk-tools .btn{padding:6px 12px;font-size:14px}
.optx.talk li{display:flex;flex-direction:column;gap:2px}
.optx.talk .ch{font-size:17px;min-width:0}
.optx.talk .en{font-size:14px;color:var(--muted)}
.mic-box{display:flex;flex-direction:column;gap:6px;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.mic-out.good{color:var(--good);font-weight:700}
.mic-out.warn{color:var(--warn);font-weight:700}
/* Solo audio: Spanish stays hidden until the learner answers or taps Show the words */
.ao-hidden{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ao-hidden .lbl{font-style:italic;color:var(--muted);font-size:17px}
.ao-row{display:flex;gap:8px;align-items:stretch}
.ao-row .speak{flex:none;align-self:center}
.ao-row .opt{flex:1}
.opt .hid,.chip-lg .hid{font-style:italic;color:var(--muted);font-weight:400}
.ao-chip{display:inline-flex;gap:6px;align-items:center;flex:1 1 30%}
.ao-chip .chip-lg{flex:1}
.fc-es{font-size:18px;font-weight:700;color:var(--accent)}
@media (prefers-reduced-motion: reduce){.fc-inner,.bar i,.btn{transition:none}}
/* ---------- Phone layout (window narrower than 640px) ---------- */
@media (max-width:640px){
  html,body{height:auto}
  .app{padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
  .top{padding-block:14px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
  .brand{gap:10px}
  .logo{width:34px;height:34px;font-size:13px;border-radius:9px}
  .brand h1{font-size:19px}
  .brand small{font-size:10px}
  .streak{padding:5px 10px 5px 7px;font-size:14px}
  .top-r{gap:6px;flex:none}
  .brand{min-width:0}
  .logo{flex:none}
  .ao-toggle{padding:5px 9px 5px 7px;font-size:12px;gap:4px}
  /* tabs become a bottom app bar */
  .tabs{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:20;margin:0;padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(20,30,60,.08);overflow:visible;gap:0;justify-content:space-around}
  .tab{flex:1 1 0;min-width:0;padding:6px 2px;border:0;border-radius:10px;gap:3px}
  .tab svg{display:block}
  .tab b{font-size:11px;font-weight:700}
  .tab span{display:none}
  .tab b.lg{display:none}
  .tab b.sm{display:block}
  .tab[aria-current="page"]{background:var(--accent-soft);box-shadow:none}
  main{gap:14px}
  .panel{padding:16px 14px;border-radius:12px}
  .h2{font-size:22px}
  .stats{grid-template-columns:1fr 1fr;gap:8px}
  .stat{padding:10px 12px}
  .stat b{font-size:24px}
  .row .btn.big{width:100%}
  .btn.big{padding:13px 18px;font-size:16px;flex-direction:column;gap:2px}
  .grid{grid-template-columns:1fr}
  .unit{padding:14px}
  .fc{height:280px}
  .fc-word{font-size:clamp(26px,8vw,36px)}
  .fc-grade{left:10px;right:10px;bottom:10px}
  .fc-grade .btns{gap:8px}
  .fc-grade .btn{padding:9px 4px;font-size:15px}
  .fc-grade .btn small{font-size:11px}

  ["Son las dos y media.","It's two thirty.","That tells the time. She asked for your phone number."],
  ["Tengo un teléfono.","I have a phone.","True, but it doesn't give her the number."]]},
 {p:"¿Cuántos estudiantes hay en tu clase de español?", e:"How many students are in your Spanish class?", q:1, r:[
  ["Hay veinticinco estudiantes.","There are twenty-five students.","Hay means \"there is / there are\". ¿Cuántos? asks for a number."],
  ["Hay veinticinco años.","There are twenty-five years.","Años are years. She asked about estudiantes."],
  ["Es la clase de español.","It's Spanish class.","That names the class but doesn't say how many students."]]},
 {p:"¡Qué grande! En mi clase hay dieciocho. ¿Cuánto es quince más quince?", e:"That's big! My class has eighteen. What's fifteen plus fifteen?", r:[
  ["Quince más quince son treinta.","Fifteen plus fifteen is thirty.","Treinta is 30. Más means plus."],
  ["Quince más quince son cincuenta.","Fifteen plus fifteen is fifty.","Cincuenta is 50. Thirty is treinta."],
  ["Quince más quince son trece.","Fifteen plus fifteen is thirteen.","Trece (13) and treinta (30) sound alike. Treinta is the one you need."]]},
 {p:"¡Correcto! Eres muy inteligente.", e:"Correct! You're very smart.", r:[
  ["¡Gracias!","Thanks!","Someone gives you a compliment, you say gracias."],
  ["De nada.","You're welcome.","De nada answers gracias. She paid you a compliment."],
  ["Lo siento.","I'm sorry.","There's nothing to apologize for."]]}]},

{id:'fechas', unit:'fechas', title:"¿Cuándo es tu cumpleaños?", en:"Days, dates and birthdays", who:"Diego", role:"a friend from school", set:"Diego is planning birthday parties for the year and asks you some questions.", turns:[
 {p:"¿Qué día es hoy?", e:"What day is today?", q:1, r:[
  ["Hoy es viernes.","Today is Friday.","Days of the week use ser: hoy es + day. No capital letter on viernes."],
  ["Hoy está viernes.","(wrong verb) Today is Friday.","Days and dates are Time, so they use ser, not estar."],
  ["Hoy hace sol.","It's sunny today.","That answers ¿Qué tiempo hace? (What's the weather?)."]]},
 {p:"¡Qué bueno! ¿Cuál es la fecha de hoy?", e:"Great! What's today's date?", q:["¿Cuál es la fecha de hoy?","What's today's date?"], r:[
  ["Es el doce de octubre.","It's October twelfth.","Dates go el + number + de + month: el doce de octubre."],
  ["Es octubre doce.","It's October twelve.","That's English order. Spanish puts the number first: el doce de octubre."],
  ["Es lunes.","It's Monday.","That's the day of the week. The fecha is the date."]]},
 {p:"¿Cuándo es tu cumpleaños?", e:"When is your birthday?", q:1, r:[
  ["Mi cumpleaños es el tres de marzo.","My birthday is March third.","Same pattern as any date: el + number + de + month."],
  ["Tengo tres años.","I'm three years old.","That's your age, and a very young one!"],
  ["Me gusta mi cumpleaños.","I like my birthday.","Nice, but ¿Cuándo? asks when."]]},
 {p:"¿En qué mes es el Día de Acción de Gracias?", e:"What month is Thanksgiving in?", r:[
  ["Es en noviembre.","It's in November.","Thanksgiving is in noviembre. En + month means \"in\" that month."],
  ["Es en julio.","It's in July.","July is the Fourth of July. Thanksgiving is in November."],
  ["Es el jueves.","It's on Thursday.","Thanksgiving is on a Thursday, but he asked which mes (month)."]]},
 {p:"¿Qué día no tienes clases?", e:"What day don't you have classes?", q:1, r:[
  ["No tengo clases los sábados.","I don't have classes on Saturdays.","Los sábados means \"on Saturdays\" (every Saturday). Days take el or los, never en."],
  ["No tengo clases en sábado.","I don't have classes in Saturday.","Spanish doesn't use en with days. Say el sábado or los sábados."],
  ["No tengo la clase de arte.","I don't have art class.","That says which class, not which day."]]}], end:["¡Yo tampoco! Hasta el lunes.","Me neither! See you Monday."]},

{id:'clase', unit:'clase', title:"¿Tienes un lápiz?", en:"Borrowing supplies in class", who:"Camila", role:"a classmate who sits next to you", set:"Class is about to start and Camila forgot some things.", turns:[
 {p:"Oye, ¿tienes un lápiz?", e:"Hey, do you have a pencil?", r:[
  ["Sí, tengo un lápiz. Aquí está.","Yes, I have a pencil. Here it is.","She asked if you have one, so answer with tengo."],
  ["Sí, tengo una lápiz.","Yes, I have a pencil.","Lápiz is masculine (el lápiz), so it's un lápiz."],
  ["Sí, es un lápiz.","Yes, it's a pencil.","That says what something is. She asked if you have one."]]},
 {p:"Gracias. ¿Qué clase tienes ahora?", e:"Thanks. What class do you have now?", q:["¿Qué clase tienes ahora?","What class do you have now?"], r:[
  ["Tengo la clase de ciencias.","I have science class.","Tengo la clase de + subject."],
  ["Tengo un cuaderno.","I have a notebook.","A cuaderno is a notebook, not a class."],
  ["Son las diez.","It's ten o'clock.","That's the time. She asked which class."]]},
 {p:"¿Dónde está tu mochila?", e:"Where is your backpack?", q:1, r:[
  ["Está cerca de la puerta.","It's near the door.","Where something is uses estar: está + place."],
  ["Es cerca de la puerta.","(wrong verb) It's near the door.","Location always uses estar, not ser. Remember PLACE."],
  ["Mi mochila es azul.","My backpack is blue.","That's its color. ¿Dónde? asks where."]]},
 {p:"¿Cómo es tu profesor de matemáticas?", e:"What is your math teacher like?", q:1, r:[
  ["Es simpático y un poco serio.","He's nice and a little serious.","¿Cómo es? asks what someone is like. Profesor is a man, so the adjectives end in -o."],
  ["Es simpática y un poco seria.","She's nice and a little serious.","Profesor is masculine, so the adjectives need -o: simpático, serio."],
  ["Está en la cafetería.","He's in the cafeteria.","That says where he is. ¿Cómo es? asks what he's like."]]},
 {p:"¡Uy, la profesora! Necesitamos estudiar.", e:"Uh-oh, the teacher! We need to study.", r:[
  ["Tienes razón. Abro mi libro.","You're right. I'm opening my book.","Opening your book is what you do to start studying."],
  ["Tienes razón. Cierro mi libro.","You're right. I'm closing my book.","Cerrar is to close. That's the opposite of studying!"],
  ["No, gracias.","No, thanks.","No, gracias turns down an offer. She didn't offer you anything."]]}]},

{id:'descripciones', unit:'descripciones', title:"¿Cómo eres?", en:"Describing yourself and others", who:"Valentina", role:"a new friend", set:"Valentina is getting to know you and your family.", turns:[
 {p:"¿Cómo eres?", e:"What are you like?", q:1, r:[
  ["Soy inteligente y muy paciente.","I'm smart and very patient.","¿Cómo eres? asks about personality, which uses ser: soy + adjectives."],
  ["Estoy inteligente.","(wrong verb) I'm smart.","Personality is a Characteristic, so it uses ser: soy inteligente."],
  ["Estoy bien, gracias.","I'm fine, thanks.","That answers ¿Cómo estás? (How are you?). ¿Cómo eres? means \"What are you like?\""]]},
 {p:"¿Cómo es tu mejor amigo?", e:"What is your best friend like?", q:1, r:[
  ["Es alto, moreno y muy gracioso.","He's tall, dark-haired and very funny.","Amigo is masculine, so every adjective ends in -o."],
  ["Es alta, morena y muy graciosa.","She's tall, dark-haired and very funny.","Amigo (with -o) is a boy, so the adjectives need -o."],
  ["Está alto y moreno.","(wrong verb) He's tall and dark-haired.","Looks are Description, so they use ser: es alto."]]},
 {p:"¿Y tus hermanas? ¿Cómo son?", e:"And your sisters? What are they like?", r:[
  ["Son rubias y simpáticas.","They're blond and nice.","They are = son. Hermanas are girls and plural, so -as."],
  ["Es rubia y simpática.","She's blond and nice.","Es is for one person. For two sisters, use son and add -s."],
  ["Son rubios y simpáticos.","They're blond and nice.","Your sisters are all girls, so the adjectives end in -as, not -os."]]},
 {p:"¿Cómo estás hoy?", e:"How are you today?", q:1, r:[
  ["Estoy feliz porque es viernes.","I'm happy because it's Friday.","How you feel today is an Emotion, so it uses estar."],
  ["Soy alto y moreno.","I'm tall and dark-haired.","That's what you look like (¿Cómo eres?). Hoy asks how you feel today."],
  ["Estás feliz.","You're happy.","Estás is the tú form. Talking about yourself, use estoy."]]},
 {p:"Yo también. ¡Hasta mañana!", e:"Me too. See you tomorrow!", r:[
  ["¡Hasta mañana!","See you tomorrow!","She said goodbye, so say it back."],
  ["¡Mucho gusto!","Nice to meet you!","You say mucho gusto when you first meet. Now she is leaving."],
  ["¿Cómo te llamas?","What's your name?","Odd to ask her name as she leaves. You already know it."]]}]},

{id:'familia', unit:'familia', title:"Mi familia", en:"Talking about your family and pets", who:"Andrés", role:"a classmate working on a family project with you", set:"You and Andrés are interviewing each other for a family-tree project.", turns:[
 {p:"¿Cuántas personas hay en tu familia?", e:"How many people are in your family?", q:1, r:[
  ["Hay cinco personas en mi familia.","There are five people in my family.","Hay + number answers ¿Cuántas?"],
  ["Hay cinco personas en mi clase.","There are five people in my class.","He asked about your familia, not your clase."],
  ["Tengo cinco años.","I'm five years old.","That's an age, and a very young one."]]},
 {p:"¿Tienes hermanos?", e:"Do you have brothers or sisters?", q:1, r:[
  ["Sí, tengo un hermano y una hermana.","Yes, I have a brother and a sister.","Use tener for family you have. Hermano takes un, hermana takes una."],
  ["Sí, tengo una hermano.","Yes, I have a brother.","Hermano ends in -o and is masculine, so it's un hermano."],
  ["Sí, soy un hermano.","Yes, I am a brother.","That says what you are. To say you have siblings, use tengo."]]},
 {p:"¿Cómo se llama tu madre?", e:"What is your mother's name?", q:1, r:[
  ["Se llama Laura.","Her name is Laura.","For someone else's name, use se llama."],
  ["Me llamo Laura.","My name is Laura.","Me llamo is YOUR name. For your mom, say se llama."],
  ["Tiene cuarenta años.","She's forty.","That's her age, not her name."]]},
 {p:"¿Tienes mascotas?", e:"Do you have pets?", q:1, r:[
  ["Sí, tengo un gato. Se llama Max.","Yes, I have a cat. His name is Max.","A gato is a pet, and it is masculine: un gato."],
  ["Sí, tengo un primo.","Yes, I have a cousin.","A primo is a cousin, not a pet!"],
  ["Sí, tengo una gato.","Yes, I have a cat.","Gato ends in -o and is masculine, so it's un gato."]]},
 {p:"¡Qué lindo! Yo tengo dos perros. ¿Te gustan los perros?", e:"How cute! I have two dogs. Do you like dogs?", r:[
  ["Sí, me gustan mucho.","Yes, I like them a lot.","Los perros is plural, so it's gustan."],
  ["Sí, me gusta mucho.","Yes, I like it a lot.","Los perros is more than one thing, so use gustan."],
  ["Sí, tengo dos perros.","Yes, I have two dogs.","That repeats what he said. He asked if you like dogs."]]}]},

{id:'actividades', unit:'actividades', title:"¿Qué te gusta hacer?", en:"Free time and making plans", who:"Isabel", role:"a friend from school", set:"You and Isabel are talking about what you do after school.", turns:[
 {p:"¿Qué te gusta hacer?", e:"What do you like to do?", q:1, r:[
  ["Me gusta bailar y escuchar música.","I like to dance and listen to music.","Activities always take gusta, even when you name two."],
  ["Me gustan bailar y escuchar música.","I like to dance and listen to music.","Activities (verbs) always use gusta, never gustan."],
  ["Yo gusto bailar.","(not Spanish) I like to dance.","Spanish doesn't say yo gusto. Say me gusta."]]},
 {p:"¿Practicas deportes?", e:"Do you play sports?", q:1, r:[
  ["Sí, nado y corro mucho.","Yes, I swim and run a lot.","Talking about yourself, regular verbs end in -o: nado, corro."],
  ["Sí, nadas y corres mucho.","Yes, you swim and run a lot.","Nadas and corres are tú forms (you). For I, use nado and corro."],
  ["Sí, veo la tele.","Yes, I watch TV.","Watching TV isn't a sport."]]},
 {p:"¿Qué no te gusta hacer?", e:"What don't you like to do?", q:1, r:[
  ["No me gusta trabajar los sábados.","I don't like working on Saturdays.","Put no in front of me gusta."],
  ["Me gusta trabajar los sábados.","I like working on Saturdays.","She asked what you DON'T like. You need no in front."],
  ["No te gusta trabajar.","You don't like to work.","Te gusta is about you (the person you talk to). For yourself, use me."]]},
 {p:"¿Quieres ver una película el sábado?", e:"Do you want to watch a movie on Saturday?", r:[
  ["¡Sí, quiero! ¿A qué hora?","Yes, I want to! What time?","Quiero is the yo form of querer. Asking ¿A qué hora? keeps the plan going."],
  ["Sí, quieres.","Yes, you want to.","Quieres is the tú form. Say quiero for I want."],
  ["Sí, es sábado.","Yes, it's Saturday.","That doesn't answer whether you want to go."]]},
 {p:"A las siete. ¡Hasta el sábado!", e:"At seven. See you Saturday!", r:[
  ["¡Perfecto! ¡Hasta el sábado!","Perfect! See you Saturday!","Agree to the plan and say goodbye."],
  ["De nada.","You're welcome.","De nada answers gracias. She didn't thank you."],
  ["Son las siete.","It's seven o'clock.","That says it is seven right now. The movie is A las siete (at seven)."]]}]},

{id:'comida', unit:'comida', title:"En el restaurante", en:"Ordering food at a restaurant", who:"El mesero", role:"a polite waiter at a Mexican restaurant who speaks to the student as usted", set:"You're at a restaurant. The waiter comes to your table.", turns:[
 {p:"Buenas tardes. ¿Qué desea comer?", e:"Good afternoon. What would you like to eat?", r:[
  ["Quiero una hamburguesa, por favor.","I want a hamburger, please.","Quiero + food + por favor is a polite order."],
  ["Quiero un hamburguesa, por favor.","I want a hamburger, please.","Hamburguesa ends in -a and is feminine, so it's una."],
  ["Me gusta comer.","I like to eat.","True, but it doesn't tell him what to bring."]]},
 {p:"Muy bien. ¿Y para beber?", e:"Very good. And to drink?", q:["¿Qué quieres beber?","What do you want to drink?"], r:[
  ["Un jugo de naranja, por favor.","An orange juice, please.","Beber is to drink, so order a drink."],
  ["Una ensalada, por favor.","A salad, please.","A salad is food. He asked about a drink."],
  ["Tengo hambre.","I'm hungry.","Hambre is hunger. For a drink, you'd say tengo sed, and then order."]]},
 {p:"¿Quiere usted algo más?", e:"Would you like anything else?", r:[
  ["No, gracias. Es todo.","No, thanks. That's all.","No, gracias politely says you don't want more."],
  ["No, de nada.","No, you're welcome.","De nada answers gracias. Use no, gracias."],
  ["Sí, gracias. Es todo.","Yes, thanks. That's all.","Sí says you want more, then es todo says you don't. Pick one!"]]},
 {p:"¿Cómo está la comida?", e:"How is the food?", q:["¿Cómo está la pizza?","How is the pizza?"], r:[
  ["¡Está deliciosa!","It's delicious!","How food tastes right now uses estar. Comida is feminine, so deliciosa."],
  ["¡Está delicioso!","It's delicious!","Comida ends in -a and is feminine, so the adjective is deliciosa."],
  ["¡Qué asco!","How gross!","That means you hate it. Not very nice to say to the waiter!"]]},
 {p:"Me alegro. Son ocho dólares.", e:"I'm glad. That's eight dollars.", r:[
  ["Aquí tiene. Muchas gracias.","Here you go. Thank you very much.","Aquí tiene (here you go) is what you say as you hand someone money."],
  ["Son las ocho.","It's eight o'clock.","Son las ocho tells the time. He told you the price."],
  ["Tengo ocho años.","I'm eight years old.","That's an age, not a payment!"]]}], end:["Gracias a usted. ¡Que tenga un buen día!","Thank you. Have a nice day!"]},

{id:'preguntas', unit:'preguntas', title:"¿A qué hora?", en:"Time, schedules and question words", who:"Lucas", role:"a new student who doesn't know the school yet", set:"Lucas is new and asks you about the school day.", turns:[
 {p:"Perdón, ¿qué hora es?", e:"Excuse me, what time is it?", q:["¿Qué hora es?","What time is it?"], r:[
  ["Son las tres y media.","It's three thirty.","After one o'clock, use son las + hour."],
  ["Es las tres y media.","It's three thirty.","Only one o'clock uses es la. Three uses son las."],
  ["A las tres y media.","At three thirty.","A las means \"at\" a time, for when something happens. He asked what time it is now."]]},
 {p:"Gracias. ¿A qué hora es la clase de español?", e:"Thanks. What time is Spanish class?", q:["¿A qué hora es tu clase de español?","What time is your Spanish class?"], r:[
  ["Es a las nueve de la mañana.","It's at nine in the morning.","¿A qué hora? asks when, so answer with a las."],
  ["Son las nueve de la mañana.","It's nine in the morning (now).","That says what time it is right now. Use a las for when the class is."],
  ["Es en la biblioteca.","It's in the library.","That says where. He asked when."]]},
 {p:"¿Quién es el profesor?", e:"Who is the teacher?", q:["¿Quién es tu profesor de español?","Who is your Spanish teacher?"], r:[
  ["Es el señor García.","It's Mr. García.","¿Quién? asks who, so answer with a name."],
  ["Es muy simpático.","He's very nice.","That says what he's like (¿Cómo es?). ¿Quién? asks who."],
  ["Es a las nueve.","It's at nine.","That says when. ¿Quién? asks who."]]},
 {p:"¿Te gusta la clase? ¿Por qué?", e:"Do you like the class? Why?", q:["¿Por qué te gusta tu clase favorita?","Why do you like your favorite class?"], r:[
  ["Sí, porque es divertida.","Yes, because it's fun.","Porque (one word, no accent) means because. Clase is feminine, so divertida."],
  ["Sí, ¿por qué es divertida?","Yes, why is it fun?","¿Por qué? asks why. To answer, use porque."],
  ["Sí, porque es divertido.","Yes, because it's fun.","Clase is feminine, so the adjective needs -a: divertida."]]},
 {p:"¿Cuántas clases tienes hoy?", e:"How many classes do you have today?", q:1, r:[
  ["Tengo seis clases.","I have six classes.","¿Cuántas? asks how many, so answer with a number."],
  ["Son las seis.","It's six o'clock.","That's the time. He asked how many classes."],
  ["Tengo la clase de arte.","I have art class.","That names one class. He asked how many."]]}]},

{id:'colores', unit:'colores', title:"¿Qué tiempo hace?", en:"Weather, seasons and colors", who:"Paula", role:"a friend visiting from another city", set:"Paula is visiting your town and wants to know what it's like here.", turns:[
 {p:"¿Qué tiempo hace hoy?", e:"What's the weather like today?", q:1, r:[
  ["Hace calor y hace sol.","It's hot and sunny.","Most weather uses hace: hace calor, hace frío, hace sol."],
  ["Es calor y sol.","(wrong verb) It's hot and sunny.","Weather uses hace, not ser."],
  ["Tengo calor.","I'm hot.","Tengo calor is how YOU feel. Weather uses hace calor."]]},
 {p:"¿Cuál es tu estación favorita?", e:"What's your favorite season?", q:1, r:[
  ["Mi estación favorita es el invierno porque nieva.","My favorite season is winter because it snows.","Estaciones are seasons: la primavera, el verano, el otoño, el invierno."],
  ["Mi estación favorita es diciembre.","My favorite season is December.","Diciembre is a month. She asked for a season."],
  ["Mi estación favorita es el invierno porque hace calor.","My favorite season is winter because it's hot.","Winter isn't hot in most places! Try nieva or hace frío."]]},
 {p:"¿Cuál es tu color favorito?", e:"What's your favorite color?", q:1, r:[
  ["Mi color favorito es el azul.","My favorite color is blue.","When a color is used as a noun, it takes el: el azul, el rojo."],
  ["Mi color favorito es la azul.","My favorite color is blue.","Color names as nouns are masculine: el azul."],
  ["Mi color favorito es el verano.","My favorite color is summer.","Verano is a season, not a color."]]},
 {p:"¿De qué color es tu mochila?", e:"What color is your backpack?", q:1, r:[
  ["Es roja y negra.","It's red and black.","Mochila is feminine, so the colors end in -a."],
  ["Es rojo y negro.","It's red and black.","Mochila is feminine, so it's roja y negra."],
  ["Es grande.","It's big.","That's the size. She asked the color."]]},
 {p:"¿Llueve mucho aquí en abril?", e:"Does it rain a lot here in April?", r:[
  ["Sí, llueve mucho en la primavera.","Yes, it rains a lot in the spring.","Llueve means it rains. Weather verbs have one form: llueve, nieva."],
  ["Sí, llueves mucho.","Yes, you rain a lot.","Llueves means \"you rain\". Weather only uses llueve."],
  ["Sí, hace sol todo el día.","Yes, it's sunny all day.","Sunny all day means no rain. That contradicts your sí."]]}]},

{id:'lugares', unit:'lugares', title:"¿Adónde vas?", en:"Places and making plans with ir", who:"Tomás", role:"a friend from school", set:"School just ended. You run into Tomás in the hallway.", turns:[
 {p:"¿Adónde vas después de las clases?", e:"Where are you going after classes?", q:["¿Adónde vas?","Where are you going?"], r:[
  ["Voy a la biblioteca.","I'm going to the library.","¿Adónde? asks where to, so answer with voy a + place."],
  ["Voy a el parque.","I'm going to the park.","A + el always becomes al: voy al parque."],
  ["Estoy en la biblioteca.","I'm at the library.","That says where you are now. He asked where you are going."]]},
 {p:"¿Qué vas a hacer allí?", e:"What are you going to do there?", r:[
  ["Voy a estudiar para el examen.","I'm going to study for the test.","Voy a + infinitive means \"I'm going to do\" something."],
  ["Voy estudiar.","I'm going study.","You need the a: voy a estudiar."],
  ["Voy a la escuela.","I'm going to school.","That's a place. He asked what you'll do."]]},
 {p:"¿Dónde está la biblioteca?", e:"Where is the library?", q:1, r:[
  ["Está cerca del parque.","It's near the park.","Location uses estar. De + el becomes del."],
  ["Es cerca del parque.","(wrong verb) It's near the park.","Where something is uses estar, not ser."],
  ["Voy cerca del parque.","I'm going near the park.","That says where you're going. He asked where the library is."]]},
 {p:"¿Quieres ir al centro comercial el domingo?", e:"Do you want to go to the mall on Sunday?", q:["¿Quieres ir al cine el sábado?","Do you want to go to the movies on Saturday?"], r:[
  ["Sí, ¿vamos a las dos?","Yes, shall we go at two?","Vamos means \"we go\" or \"let's go\", great for making plans."],
  ["Sí, vas a las dos.","Yes, you go at two.","Vas is the tú form. To go together, use vamos."],
  ["No, quiero ir.","No, I want to go.","No and quiero ir say opposite things."]]},
 {p:"¡Perfecto! Nos vemos el domingo.", e:"Perfect! See you Sunday.", r:[
  ["¡Hasta el domingo!","See you Sunday!","He said domingo, so you say goodbye until Sunday."],
  ["¡Hasta el lunes!","See you Monday!","You made plans for Sunday (domingo), not Monday."],
  ["¡Buenos días!","Good morning!","That's a hello. He's saying goodbye."]]}]}
];

/* ============================ PROGRESS ============================ */
const KEY='micuaderno.v1';
const INTERVALS=[0,1,3,7,14,30]; // days until a card comes back, by box
let P = {cards:{}, verbs:{}, conv:{}, days:[], settings:{vosotros:false, dir:'es'}};
try{ const raw=localStorage.getItem(KEY); if(raw){ const o=JSON.parse(raw); P=Object.assign(P,o); P.settings=Object.assign({vosotros:false,dir:'es'},o.settings||{}); if(P.verbs&&typeof P.verbs.r==='number'){ P.verbs={type:{r:P.verbs.r,w:P.verbs.w,recent:[]}}; } if(!P.verbs) P.verbs={}; if(!P.conv) P.conv={}; } }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(P)); }catch(e){} }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dateStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function markStudied(){ const t=today(); if(!P.days.includes(t)){ P.days.push(t); save(); renderStreak(); } }
function streak(){
  const set=new Set(P.days); let n=0; const d=new Date();
  if(!set.has(dateStr(d))) d.setDate(d.getDate()-1); // streak survives until end of today
  while(set.has(dateStr(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function cardId(u,i){ return u.id+'-'+i; }
function cardById(id){ const k=id.lastIndexOf('-'); const u=UNITS.find(x=>x.id===id.slice(0,k)); return u? {u, c:u.cards[+id.slice(k+1)], id} : null; }
function prog(id){ return P.cards[id]||{b:0,d:0,s:0,r:0}; }
function grade(id,res){
  const c=Object.assign({},prog(id)); c.s++;
  if(res==='got'){ c.b=Math.min(5,c.b+1); c.r++; c.d=Date.now()+INTERVALS[c.b]*864e5; }

function unitMastery(u){ let s=0; u.cards.forEach((c,i)=>{ s+=Math.min(5,prog(cardId(u,i)).b); }); return s/(5*u.cards.length); }

function b64(u8){ let t=''; for(let i=0;i<u8.length;i+=0x8000) t+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(t); }
function unb64(t){ const bin=atob(t); const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i); return u8; }
async function encodeProgress(){
  const json=JSON.stringify(P);
  try{ if('CompressionStream' in window){ const cs=new CompressionStream('gzip'); const w=cs.writable.getWriter(); w.write(new TextEncoder().encode(json)); w.close(); const buf=await new Response(cs.readable).arrayBuffer(); return 'MC1:'+b64(new Uint8Array(buf)); } }catch(e){}
  return 'MC0:'+b64(new TextEncoder().encode(json));
}
async function decodeProgress(code){
  const m=String(code).replace(/\s+/g,'').match(/^MC([01]):([A-Za-z0-9+/=]+)$/); if(!m) throw new Error('format');
  const u8=unb64(m[2]); let json;
  if(m[1]==='1'){ const ds=new DecompressionStream('gzip'); const w=ds.writable.getWriter(); w.write(u8); w.close(); json=await new Response(ds.readable).text(); }
  else json=new TextDecoder().decode(u8);
  const o=JSON.parse(json); if(!o||typeof o!=='object'||typeof o.cards!=='object') throw new Error('format'); return o;
}
function mergeProgress(o){ // higher box, more reviews and the later due date win; nothing is dropped
  let merged=0;
  const cards=Object.assign({},P.cards);
  for(const id in (o.cards||{})){ const a=cards[id], b=o.cards[id]; if(!b||typeof b!=='object') continue; merged++; cards[id]= a? {b:Math.max(a.b||0,b.b||0), d:Math.max(a.d||0,b.d||0), s:Math.max(a.s||0,b.s||0), r:Math.max(a.r||0,b.r||0)} : b; }
  const verbs=Object.assign({},P.verbs); const ov=(o.verbs&&typeof o.verbs.r==='number')?{type:{r:o.verbs.r,w:o.verbs.w,recent:[]}}:(o.verbs||{});
  for(const l in ov){ const a=verbs[l], b=ov[l]; verbs[l]= a? {r:Math.max(a.r||0,b.r||0), w:Math.max(a.w||0,b.w||0), recent:((b.recent||[]).length>=(a.recent||[]).length)?(b.recent||[]):(a.recent||[])} : b; }
  const conv=Object.assign({},P.conv);
  for(const id in (o.conv||{})){ const a=conv[id], b=o.conv[id]; if(!b||typeof b!=='object') continue; conv[id]= a? {best:Math.max(a.best||0,b.best||0), n:Math.max(a.n||0,b.n||0)} : b; }

  P={cards,verbs,conv,days,settings:Object.assign({},o.settings||{},P.settings),meta:Object.assign({},o.meta||{},P.meta||{})};
  save(); return merged;
}

  if(!FC){ // picker
    main.innerHTML=`<section class="panel"><div class="eyebrow">Tarjetas · Flashcards</div><h2 class="h2">What do you want to practice?</h2>
      <p class="sub" style="margin-top:6px">Tap a card to flip it. Say the word out loud before you flip. Then be honest about how well you knew it.</p>
      <div class="row" style="margin-top:14px"><button class="btn primary" id="todayBtn">Today's review <small>${dueCards().length} due</small></button></div></section>
      <div class="grid">${UNITS.map(u=>`<article class="unit"><div><h3>${esc(u.name)}</h3><div class="en">${esc(u.en)} · ${u.cards.length} cards</div></div>
      <div class="bar"><i style="width:${pct(unitMastery(u))}%"></i></div>
      <div class="row"><button class="btn" data-study="${u.id}">Study all</button><button class="btn ghost" data-weak="${u.id}">Only the ones I miss</button></div></article>`).join('')}</div>`;
    $('#todayBtn').onclick=()=>{ const s=buildSession(); if(!s.ids.length){ alert('Nothing is due right now. Pick a unit instead.'); return; } startCards(s.ids,'La sesión de hoy'); };
    main.querySelectorAll('[data-study]').forEach(b=>b.onclick=()=>{ const u=UNITS.find(x=>x.id===b.dataset.study); startCards(shuffle(u.cards.map((c,i)=>cardId(u,i))),u.name); });
    main.querySelectorAll('[data-weak]').forEach(b=>b.onclick=()=>{ const u=UNITS.find(x=>x.id===b.dataset.weak); let ids=u.cards.map((c,i)=>cardId(u,i)).filter(id=>prog(id).b<3); if(!ids.length) ids=u.cards.map((c,i)=>cardId(u,i)); startCards(shuffle(ids),u.name+' · weak spots'); });
    return;
  }
  if(FC.i>=FC.queue.length){ // summary
    const st=FC.stats; const uniqMissed=[...new Set(FC.missed)];
    const msg= uniqMissed.length===0? '¡Perfecto! You knew every card.' : uniqMissed.length<=3? '¡Muy bien! Only a few gave you trouble, and you got them in the end.' : 'Good work. You pushed through every card. The tricky ones come back tomorrow.';
    main.innerHTML=`<section class="panel lift"><div class="eyebrow">${esc(FC.title)}</div><h2 class="h2">${msg}</h2>
      <div class="summary-nums" style="margin-top:16px"><div class="g"><b>${st.got}</b>thumbs up</div><div class="b"><b>${st.miss}</b>thumbs down</div><div class="w"><b>${uniqMissed.length}</b>words to watch</div></div>
      <div class="row" style="margin-top:18px">
        ${uniqMissed.length?`<button class="btn primary" id="againMissed">Review the ${uniqMissed.length} I missed</button>`:''}
        <button class="btn" id="againAll">Do this set again</button>
        <button class="btn ghost" id="backHome">Back to Hoy</button></div>
      ${uniqMissed.length?`<div class="tbl" style="margin-top:18px"><table><thead><tr><th>Missed</th><th>Meaning</th></tr></thead><tbody>${uniqMissed.map(id=>{const x=cardById(id);return `<tr><td><b class="es">${esc(x.c[0])}</b></td><td>${esc(x.c[1])}</td></tr>`}).join('')}</tbody></table></div>`:''}
    </section>`;
    if($('#againMissed')) $('#againMissed').onclick=()=>startCards(shuffle(uniqMissed),FC.title+' · missed');
    $('#againAll').onclick=()=>startCards(shuffle([...new Set(FC.queue)]),FC.title);
    $('#backHome').onclick=()=>{ FC=null; go('home'); };
    return;
  }
  const id=FC.queue[FC.i]; const x=cardById(id); const [es,en,g]=x.c; const ao=audioOnly(); const dir=ao?'es':P.settings.dir; // Solo audio always plays the Spanish first
  const front= ao&&!FC.show? `<div class="fc-word">¿Qué oyes?</div>${speakBtn(es)}<span class="sub">Listen. What does it mean?</span>${showWordsBtn('fcShow')}`
    : dir==='es'? `<div class="fc-word" lang="es">${esc(es)}</div>${genderTag(g)}${speakBtn(es)}` : `<div class="fc-word">${esc(en)}</div><span class="tag n">${esc(x.u.name)}</span>`;
  const back= dir==='es'? `<div class="fc-word">${esc(en)}</div>${ao?`<span class="fc-es" lang="es">${esc(es)}</span>`:''}<span class="tag n">${esc(x.u.name)}</span>` : `<div class="fc-word" lang="es">${esc(es)}</div>${genderTag(g)}${speakBtn(es)}`;
  main.innerHTML=`<section class="fc-wrap">
    <div class="row between"><span class="eyebrow">${esc(FC.title)}</span>
      <div class="row">${ao?'<span class="sub">Solo audio · listen → English</span>':`<button class="btn ghost" id="dirBtn" title="Switch which side shows first">${dir==='es'?'Español → English':'English → Español'}</button>`}<span class="sub" style="font-variant-numeric:tabular-nums">${FC.i+1} / ${FC.queue.length}</span></div></div>
    <div class="bar"><i style="width:${pct(FC.i/FC.queue.length)}%"></i></div>
    <div class="fc ${FC.flipped?'flipped':''}" id="fc" role="button" tabindex="0" aria-label="Flashcard. Press to flip.">
      <div class="fc-inner">
        <div class="fc-face front">${front}<span class="fc-hint">tap the card to flip<span class="khint"> · space</span></span></div>
        <div class="fc-face back">${back}${FC.flipped? `<div class="fc-grade"><span class="lbl">Did you know it?</span><div class="btns">
          <button class="btn bad" data-g="miss">${THUMB_DOWN}<span>No lo sabía <small>missed</small></span><span class="kbd">1 or ←</span></button>
          <button class="btn good" data-g="got">${THUMB_UP}<span>¡Lo sé! <small>got it</small></span><span class="kbd">2 or →</span></button>
        </div></div>`:''}</div>
      </div>
    </div>
    <p class="sub" style="text-align:center;font-size:14px">Thumbs down? The card returns later in this set until you get it, and again tomorrow.</p>
  </section>`;
  const flip=()=>{ FC.flipped=!FC.flipped; renderCards(); if(FC.flipped&&dir==='en') say(es); };
  const card=$('#fc');
  card.onclick=e=>{ if(e.target.closest('[data-say],[data-g],#fcShow')) return; flip(); };
  card.onkeydown=e=>{ if(e.target!==card) return; if(e.key==='Enter'||e.key===' '){ e.preventDefault(); flip(); } };
  if($('#dirBtn')) $('#dirBtn').onclick=()=>{ P.settings.dir=dir==='es'?'en':'es'; save(); FC.flipped=false; renderCards(); };
  if($('#fcShow')) $('#fcShow').onclick=e=>{ e.stopPropagation(); FC.show=true; renderCards(); };
  main.querySelectorAll('[data-g]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); gradeCard(b.dataset.g); });
  card.focus({preventScroll:true});
  if(ao&&!FC.flipped&&FC.said!==FC.i){ FC.said=FC.i; say(es); }
}
function gradeCard(res){
  const id=FC.queue[FC.i]; grade(id,res); FC.stats[res]++;
  if(res==='miss'){ FC.missed.push(id); FC.queue.push(id); }
  FC.i++; FC.flipped=false; FC.show=false; renderCards();
}
document.addEventListener('keydown',e=>{
  if(view!=='cards'||!FC||FC.i>=FC.queue.length) return; if(e.target.matches('input,select,textarea')) return;
  const map={'1':'miss','ArrowLeft':'miss','2':'got','ArrowRight':'got'};
  if(FC.flipped&&map[e.key]){ e.preventDefault(); gradeCard(map[e.key]); }
});

/* ============================ GRAMMAR DRILLS ============================ */
// Short targeted drills launched from the grammar notes. Every option is a real form from the same set.
const NUM_WORDS=['una','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce'];
function timePhrase(h,m){ if(m===45){ const h2=h%12+1; return (h2===1?'Es la una':'Son las '+NUM_WORDS[h2-1])+' menos cuarto'; } return (h===1?'Es la una':'Son las '+NUM_WORDS[h-1])+(m===15?' y cuarto':m===30?' y media':''); }
function mc(prompt,ask,answer,options,why,extra){ return Object.assign({type:'custom',prompt,ask,answer,why,options:shuffle(options.map(l=>({l,c:l===answer})))},extra||{}); }
const DRILLS={
 pronouns:{title:'Which pronoun?',build(){
   const cues=[['I','yo'],['you, talking to a friend','tú'],['you, talking to your teacher','usted'],['he','él'],['she','ella'],['we, a group with boys','nosotros'],['we, all girls','nosotras'],['they, boys or a mixed group','ellos'],['they, all girls','ellas'],['you all','ustedes']];
   const all=cues.map(c=>c[1]);
   return shuffle(cues).map(([en,es])=>mc(en,'Which pronoun?',es,[es,...shuffle(all.filter(x=>x!==es)).slice(0,3)],`"${en}" is ${es}.`,{en:true,full:es})); }},
 serestar:{title:'Ser or estar?',build(){
   const bank=[
    ['Yo ___ de Texas.','soy','estoy','Where you are from is Origin → ser (the O in DOCTOR).'],
    ['Mi hermana ___ muy inteligente.','es','está','A personality trait is a Characteristic → ser.'],
    ['Nosotros ___ en la biblioteca.','estamos','somos','Where someone is right now is Location → estar (the L in PLACE).'],
    ['Hoy ___ lunes.','es','está','Days and dates are Time → ser.'],
    ['¿Cómo ___ tú hoy?','estás','eres','How someone feels today is a Condition → estar.'],
    ['Los estudiantes ___ cansados.','están','son','Being tired is a Condition that changes → estar.'],
    ['Mi madre ___ profesora.','es','está','A job is an Occupation → ser.'],
    ['La sopa ___ fría.','está','es','The soup is cold right now, a Condition → estar.'],
    ['Ellos ___ mis primos.','son','están','Family is a Relationship → ser.'],
    ['Yo ___ muy contenta hoy.','estoy','soy','Feeling happy today is an Emotion → estar.'],
    ['¿De dónde ___ usted?','es','está','Asking where someone is from is Origin → ser.'],
    ['El libro ___ en la mochila.','está','es','Where the book is is Location → estar.'],
    ['___ las tres de la tarde.','Son','Están','Telling time is Time → ser.'],
    ['Tú ___ alto y moreno.','eres','estás','Looks that do not change are Description → ser.'],
    ['Mis amigos ___ en el parque.','están','son','Location → estar.'],
    ['La clase de español ___ divertida.','es','está','What the class is like is a Characteristic → ser.']];
   return shuffle(bank).slice(0,10).map(([t,a,b,why])=>mc(t,'Ser or estar?',a,[a,b],why,{full:t.replace('___',a)})); }},
 gustar:{title:'Gusta or gustan?',build(){
   const bank=[
    ['Me ___ la pizza.','gusta',['gusta','gustan'],'One thing (la pizza) → gusta.'],
    ['Me ___ los perros.','gustan',['gusta','gustan'],'More than one thing (los perros) → gustan.'],
    ['¿Te ___ bailar?','gusta',['gusta','gustan'],'An activity (a verb) always takes gusta.'],
    ['No me ___ las matemáticas.','gustan',['gusta','gustan'],'Las matemáticas is plural → gustan.'],
    ['Nos ___ los deportes.','gustan',['gusta','gustan'],'Los deportes is plural → gustan.'],
    ['Me ___ el helado y el chocolate.','gustan',['gusta','gustan'],'Two things together count as plural → gustan.'],
    ['Le ___ cantar y bailar.','gusta',['gusta','gustan'],'Activities take gusta, even two of them.'],
    ['A Marta ___ gusta leer.','le',['me','te','le','nos','les'],'Marta is "she", so the pronoun is le.'],
    ['A mis padres ___ gusta el café.','les',['me','te','le','nos','les'],'My parents are "they" → les.'],
    ['¿A ti ___ gusta la música?','te',['me','te','le','nos','les'],'"A ti" means you (a friend) → te.'],
    ['A Juan y a mí ___ gusta nadar.','nos',['me','te','le','nos','les'],'Juan and I are "we" → nos.'],
    ['A usted ___ gusta la clase.','le',['me','te','le','nos','les'],'Usted (you, formal) uses le, just like he and she.'],
    ['A mí ___ gusta más el verano.','me',['me','te','le','nos','les'],'"A mí" points to me → me.']];
   return shuffle(bank).slice(0,10).map(([t,a,o,why])=>mc(t,'Fill in the blank',a,o,why,{full:t.replace('___',a)})); }},
 articles:{title:'¿El o la?',build(){
   const pool=[]; UNITS.forEach(u=>u.cards.forEach((c,i)=>{ if((c[2]==='m'||c[2]==='f')&&/^(el|la) [^\/]+$/.test(c[0])) pool.push({id:cardId(u,i),u,c}); }));
   return shuffle(pool).slice(0,10).map(x=>{ const noun=x.c[0].replace(/^(el|la) /,''); const ans=x.c[0].split(' ')[0]; return {type:'art',x,prompt:noun,ask:'¿El o la? Which article goes with this noun?',options:[{l:'el',c:ans==='el'},{l:'la',c:ans==='la'}],answer:x.c[0]}; }); }},
 adjectives:{title:'Make it agree',build(){
   const bank=[
    ['La chica es ___.','alto','alta',['alto','alta','altos','altas'],'Chica is feminine singular → -a.'],
    ['Los chicos son ___.','simpático','simpáticos',['simpático','simpática','simpáticos','simpáticas'],'Chicos is masculine plural → -os.'],
    ['Mi abuela es ___.','viejo','vieja',['viejo','vieja','viejos','viejas'],'Abuela is feminine singular → -a.'],
    ['Las clases son ___.','aburrido','aburridas',['aburrido','aburrida','aburridos','aburridas'],'Clases is feminine plural → -as.'],
    ['El libro es ___.','interesante','interesante',['interesante','interesantes'],'Adjectives ending in -e do not change for gender. Libro is singular, so no -s.'],
    ['Mis amigas son ___.','divertido','divertidas',['divertido','divertida','divertidos','divertidas'],'Amigas is feminine plural → -as.'],
    ['El perro es ___.','pequeño','pequeño',['pequeño','pequeña','pequeños','pequeñas'],'Perro is masculine singular → -o.'],
    ['Ana y Luis son ___.','trabajador','trabajadores',['trabajador','trabajadora','trabajadores','trabajadoras'],'A mixed group uses the masculine plural → trabajadores.'],
    ['La tarea es ___.','fácil','fácil',['fácil','fáciles'],'Adjectives ending in a consonant do not change for gender. Singular, so no -es.'],
    ['Los exámenes son ___.','difícil','difíciles',['difícil','difíciles'],'Plural of a consonant ending adds -es.'],
    ['Mi hermano es ___.','rubio','rubio',['rubio','rubia','rubios','rubias'],'Hermano is masculine singular → -o.'],
    ['Las mochilas son ___.','nuevo','nuevas',['nuevo','nueva','nuevos','nuevas'],'Mochilas is feminine plural → -as.']];
   return shuffle(bank).slice(0,10).map(([t,base,a,o,why])=>mc(t+' ('+base+')','Pick the form that agrees',a,o,why,{full:t.replace('___',a)})); }},
 time:{title:'¿Qué hora es?',build(){
   const MIN=[0,15,30,45]; const items=[]; const seen=new Set();
   while(items.length<10){ const h=1+Math.floor(Math.random()*12), m=MIN[Math.floor(Math.random()*4)]; const key=h+':'+m; if(seen.has(key)) continue; seen.add(key);
     const ans=timePhrase(h,m); const ds=new Set(); while(ds.size<3){ const d=timePhrase(1+Math.floor(Math.random()*12),MIN[Math.floor(Math.random()*4)]); if(d!==ans) ds.add(d); }
     const one = m===45 ? (h%12+1)===1 : h===1;
     const why=(one?'One o\'clock uses "es la". ':'Every hour after one uses "son las". ')+(m===15?'":15" is "y cuarto".':m===30?'":30" is "y media".':m===45?'":45" counts back from the next hour: "menos cuarto".':'On the hour, just the number.');
     items.push(mc(h+':'+String(m).padStart(2,'0'),'What time is it?',ans,[ans,...ds],why,{full:ans})); }
   return items; }}
};
function startDrill(key){ const d=DRILLS[key]; Q={qs:d.build(),i:0,score:0,answered:null,title:d.title,drill:key}; go('quiz'); }
function goVerbs(group){ V.group=group; V.cur=null; V.state='ask'; go('verbs'); }
function practice(list){ return `<div class="practice"><span class="eyebrow">Practice this</span><div class="row">${list.map(a=>`<button class="btn" type="button" data-act="${a.act}" data-arg="${a.arg}">${a.label}${a.sub?` <small>${a.sub}</small>`:''}</button>`).join('')}</div></div>`; }
function wirePractice(){ main.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{ const a=b.dataset.arg; switch(b.dataset.act){ case 'drill': startDrill(a); break; case 'verbs': goVerbs(a); break; case 'quiz': startQuiz(a); break; case 'talk': startConv(a); break; case 'cards': { const u=UNITS.find(x=>x.id===a); startCards(shuffle(u.cards.map((c,i)=>cardId(u,i))),u.name); } } }); }

/* ============================ QUIZ ============================ */
let Q=null;
function makeQuestion(x,pool){
  const [es,en,g]=x.c; const types=['es2en','en2es']; const single=/^(el|la) [^\/]+$/.test(es); if(single) types.push('art');
  const t=pick(types);
  if(t==='art'){ const noun=es.replace(/^(el|la) /,''); const ans=es.split(' ')[0]; return {type:t,x,prompt:noun,ask:'¿El o la? Which article goes with this noun?',options:[{l:'el',c:ans==='el'},{l:'la',c:ans==='la'}],answer:es}; }
  const others=shuffle(pool.filter(o=>o.id!==x.id && o.c[1]!==en && o.c[0]!==es)).slice(0,3);
  if(t==='es2en'){ const opts=shuffle([{l:en,c:true},...others.map(o=>({l:o.c[1],c:false}))]); return {type:t,x,prompt:es,ask:'What does this mean?',options:opts,answer:en,say:es}; }
  const opts=shuffle([{l:es,c:true},...others.map(o=>({l:o.c[0],c:false}))]); return {type:t,x,prompt:en,ask:'How do you say this in Spanish?',options:opts,answer:es};
}
// What Solo audio says for a hidden quiz prompt: the blank becomes a pause, the (hint) is read after it.
function quizSpoken(q){ return q.say||q.prompt.replace(/_+/g,', ,').replace(/\s*\((.+?)\)\s*$/,'. $1'); }
function startQuiz(unitId){
  let pool=[]; let title='';
  if(unitId==='studied'){ UNITS.forEach(u=>u.cards.forEach((c,i)=>{ const id=cardId(u,i); if(prog(id).s>0) pool.push({id,u,c}); })); title='Everything I have studied'; }
  else { const u=UNITS.find(x=>x.id===unitId); pool=u.cards.map((c,i)=>({id:cardId(u,i),u,c})); title=u.name; }
  if(pool.length<4){ UNITS.slice(0,2).forEach(u=>u.cards.forEach((c,i)=>pool.push({id:cardId(u,i),u,c}))); }
  const n=Math.min(10,pool.length);
  // favor weaker cards: sort by box then shuffle within
  const chosen=shuffle(pool).sort((a,b)=>prog(a.id).b-prog(b.id).b).slice(0,Math.min(pool.length,n*2)); 
  const qs=shuffle(chosen).slice(0,n).map(x=>makeQuestion(x,pool));
  Q={qs,i:0,score:0,answered:null,title,unitId}; go('quiz');
}
function renderQuiz(){
  if(!Q){
    main.innerHTML=`<section class="panel"><div class="eyebrow">Prueba · Quiz</div><h2 class="h2">Ten quick questions</h2>
      <p class="sub" style="margin-top:6px">Multiple choice, mixed directions, plus <span class="es">el</span> or <span class="es">la</span> for nouns. Wrong answers get a quick explanation.</p>
      <div class="row" style="margin-top:14px"><select id="qUnit" aria-label="Choose a unit"><option value="studied">Everything I have studied</option>${UNITS.map(u=>`<option value="${u.id}">${esc(u.name)} · ${esc(u.en)}</option>`).join('')}</select>
      <button class="btn primary" id="qStart">Empezar <small>start</small></button></div>
      <div class="eyebrow" style="margin-top:22px">Grammar drills</div>
      <p class="sub" style="margin:4px 0 10px">Ten quick questions on one rule. These also live under each section in Apuntes.</p>
      <div class="chips">${Object.entries(DRILLS).map(([k,d])=>`<button class="chip" type="button" data-act="drill" data-arg="${k}">${esc(d.title)}</button>`).join('')}</div></section>`;
    $('#qStart').onclick=()=>startQuiz($('#qUnit').value); wirePractice(); return;
  }
  if(Q.i>=Q.qs.length){
    const s=Q.score,n=Q.qs.length; const msg= s===n?'¡Perfecto! 100%.': s>=n*0.8?'¡Excelente! You are getting this.': s>=n*0.6?'¡Bien! A few more rounds and this unit is yours.':'Good start. Review these words with flashcards, then try again.';
    const hasCards=Q.qs.some(q=>q.x);
    main.innerHTML=`<section class="panel lift"><div class="eyebrow">${esc(Q.title)}</div><h2 class="h2">${s} / ${n} · ${msg}</h2>
      <div class="row" style="margin-top:18px"><button class="btn primary" id="qAgain">Try again</button>${hasCards?'<button class="btn" id="qCards">Flashcards for the ones I missed</button>':''}${Q.drill?'<button class="btn" id="qNotes">Read the rule in Apuntes</button>':''}<button class="btn ghost" id="qHome">Back to Hoy</button></div></section>`;
    $('#qAgain').onclick=()=>Q.drill?startDrill(Q.drill):startQuiz(Q.unitId||'studied'); $('#qHome').onclick=()=>{ Q=null; go('home'); };
    if($('#qNotes')) $('#qNotes').onclick=()=>{ Q=null; go('notes'); };
    if($('#qCards')) $('#qCards').onclick=()=>{ const ids=[...new Set(Q.qs.filter(q=>q.wrong&&q.x).map(q=>q.x.id))]; if(!ids.length){ alert('You missed nothing!'); return; } startCards(ids,Q.title+' · missed'); };
    return;
  }
  const q=Q.qs[Q.i]; const letters='ABCD';
  // Solo audio hides whatever is Spanish: the prompt (except English cues and clock times) and Spanish choices (not el / la)
  const hide=audioOnly()&&!Q.show&&Q.answered===null;
  const promptEs=q.type==='es2en'||q.type==='art'||(q.type==='custom'&&!q.en&&!/^\d/.test(q.prompt));
  const optsEs=q.type==='en2es'||q.type==='custom';
  const spoken=quizSpoken(q);
  const promptHtml=hide&&promptEs? aoHidden(spoken,'Listen to the question…')
    : `<div class="prompt" ${(q.type!=='en2es'&&!q.en)?'lang="es"':''}>${esc(q.prompt)}</div>${q.say?speakBtn(q.say):''}`;
  main.innerHTML=`<section class="panel lift">
    <div class="row between"><span class="eyebrow">${esc(Q.title)}</span><span class="sub" style="font-variant-numeric:tabular-nums">${Q.i+1} / ${Q.qs.length} · ${Q.score} right</span></div>
    <div class="bar" style="margin:10px 0 18px"><i style="width:${pct(Q.i/Q.qs.length)}%"></i></div>
    <div class="eyebrow">${q.ask}</div>
    <div class="row" style="margin:6px 0 18px">${promptHtml}</div>
    <div class="opts">${q.options.map((o,i)=>{ let cls=''; if(Q.answered!==null){ if(o.c) cls='right'; else if(i===Q.answered) cls='wrong'; }
      if(hide&&optsEs) return aoOption(o.l,`<button class="opt" data-i="${i}" aria-label="Choice ${letters[i]}"><span class="k">${letters[i]}</span><span class="hid">Choice ${letters[i]}</span></button>`);
      return `<button class="opt ${cls}" data-i="${i}" ${Q.answered!==null?'disabled':''}><span class="k">${letters[i]}</span><span ${q.type!=='es2en'?'lang="es"':''}>${esc(o.l)}</span></button>`; }).join('')}</div>

  main.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));

    $('#qNext').onclick=()=>{ Q.i++; Q.answered=null; Q.show=false; renderQuiz(); }; $('#qNext').focus();

}
function answer(i){ if(Q.answered!==null) return; const q=Q.qs[Q.i]; Q.answered=i; const right=q.options[i].c; if(right) Q.score++; else q.wrong=true;
  if(q.x){ grade(q.x.id,right?'got':'miss'); if(q.type!=='en2es'||right) say(q.x.c[0]); } else if(q.full&&!q.en) say(q.full);
  renderQuiz(); }
document.addEventListener('keydown',e=>{ if(view!=='quiz'||!Q||Q.i>=Q.qs.length||Q.answered!==null) return; if(e.target.matches('input,select,textarea')) return; const k=e.key.toUpperCase(); const i='ABCD'.indexOf(k); if(i>=0&&i<Q.qs[Q.i].options.length) answer(i); else if(['1','2','3','4'].includes(e.key)&&(+e.key)<=Q.qs[Q.i].options.length) answer(+e.key-1); });

/* ============================ VERB DRILL ============================ */
// Two levels the learner picks: 'build' (pick the ending from the verb's own table) and 'type' (write the form).
const VLEVELS=[{id:'build',es:'Construir',en:'build it'},{id:'type',es:'Escribir',en:'type it'}];
let V={group:'ar',cur:null,state:'ask',right:0,total:0,run:0,last:null,nudgeHidden:false,show:false,said:null};
function vLevel(){ return P.settings.verbLevel||'build'; }
function vStats(l){ if(!P.verbs[l]) P.verbs[l]={r:0,w:0,recent:[]}; if(!P.verbs[l].recent) P.verbs[l].recent=[]; return P.verbs[l]; }
function vAcc(l){ const st=P.verbs[l]; const t=st?st.r+st.w:0; return t?pct(st.r/t):null; }
function pronIdx(){ return [0,1,2,3,5].concat(P.settings.vosotros?[4]:[]); }
function nextVerb(){
  const g=VERB_GROUPS.find(x=>x.id===V.group); const vs=VERBS.filter(g.f); const v=pick(vs); const idx=pronIdx();
  let pi=pick(idx); if(V.cur&&V.cur.v===v&&V.cur.pi===pi) pi=pick(idx.filter(i=>i!==pi));
  // Build options: only real endings (regular) or real forms (irregular) of THIS verb, shuffled
  const opts=shuffle(idx.map(i=>({i, label: v.type==='irr'? conj(v)[i] : '-'+ENDINGS[v.type][i]})));
  V.cur={v,pi,opts}; V.state='ask'; V.show=false;
}
const ENDING_HINTS=['yo always ends in -o, for every regular verb','tú always ends in -s','él / ella / usted is the bare theme vowel: -a for -ar verbs, -e for -er and -ir','nosotros always ends in -mos','vosotros ends in -áis, -éis or -ís (Spain only)','ellos / ellas / ustedes always ends in -n'];
function optionsBreakdown(v,pi,opts,picked){
  const f=conj(v);
  return `<div class="optx"><div class="eyebrow">What each option was</div><ul>${opts.map(o=>{
    const cls=(o.i===pi?'correct':'')+(o.i===picked?' picked':'');
    const tag=o.i===pi?'<span class="tag good">correct</span>':o.i===picked?'<span class="tag bad">your pick</span>':'';
    const hint=v.type==='irr'?`irregular form for ${esc(PRON_EN[o.i])}`:ENDING_HINTS[o.i];
    return `<li class="${cls.trim()}"><span class="ch" lang="es">${esc(o.label)}</span><span><span lang="es">${esc(PRON[o.i])}</span> <span class="sub">(${esc(PRON_EN[o.i])})</span>${v.type==='irr'?'':` → <b class="es" lang="es">${esc(f[o.i])}</b>`} ${speakBtn(PRON[o.i].split(' / ')[0]+' '+f[o.i],true)} ${tag}</span><span class="hint">${hint}</span></li>`; }).join('')}</ul></div>`;
}
function verbTable(v,hi){ const f=conj(v); return `<div class="tbl"><table><thead><tr><th>${esc(v.inf)} · ${esc(v.en)}</th><th></th></tr></thead><tbody>${PRON.map((p,i)=>(i===4&&!P.settings.vosotros)?'':`<tr><td>${esc(p)}<br><span class="sub" style="font-size:12px">${esc(PRON_EN[i])}</span></td><td class="${i===hi?'hl':''}"><b class="es" lang="es">${esc(f[i])}</b></td></tr>`).join('')}</tbody></table></div>`; }
function recordVerb(kind){
  const st=vStats(vLevel()); const ok=kind!=='wrong';
  V.total++; if(ok){ V.right++; V.run++; st.r++; } else { V.run=0; st.w++; }
  st.recent.push(ok?1:0); if(st.recent.length>10) st.recent.shift();
  save(); markStudied();
}
function readyToMoveUp(){ const st=vStats('build'); return vLevel()==='build' && st.recent.length>=10 && st.recent.reduce((a,b)=>a+b,0)>=8; }
function renderVerbs(){
  if(!V.cur) nextVerb();
  const {v,pi,opts}=V.cur; const target=conj(v)[pi]; const level=vLevel(); const stem=v.inf.slice(0,-2);
  const acc=V.total?pct(V.right/V.total)+'%':'—';
  let body='';
  const hide=audioOnly()&&!V.show&&V.state==='ask'; const cue=PRON[pi].split(' / ')[0]+', '+v.inf;
  if(V.state==='ask'){
    const head=`<div class="eyebrow">${level==='build'?'Build the present tense form':'Conjugate in the present tense'}</div>
      ${hide?`<div class="row" style="margin:6px 0 4px">${aoHidden(cue,'Listen: who, and which verb?')}${showWordsBtn('vShowWords')}</div>`
      :`<div class="row" style="margin:6px 0 4px"><div class="prompt" lang="es">${esc(PRON[pi])} <span style="color:var(--muted);font-weight:500">+</span> ${esc(v.inf)}</div></div>
      <p class="sub">${esc(v.inf)} = ${esc(v.en)} · ${esc(PRON_EN[pi])}${v.type==='irr'?' · <b>irregular</b>':' · regular -'+v.type}</p>`}`;

        <div class="chips-lg" style="margin-top:10px">${opts.map((o,k)=>`<span class="ao-chip">${speakBtn(conj(v)[o.i])}<button class="chip-lg" type="button" data-pick="${o.i}" aria-label="Form ${k+1}"><span class="hid">${k+1}</span></button></span>`).join('')}</div>`;
    } else if(level==='build'){
      body=head+(v.type!=='irr'
        ? `<div class="build" lang="es" aria-label="Stem with a blank ending"><span class="stem">${esc(stem)}</span><span class="slot" id="slot">&nbsp;</span></div>
           <p class="sub">Drop <b>-${v.type}</b>, keep <b lang="es">${esc(stem)}-</b>, then tap the ending for <b lang="es">${esc(PRON[pi])}</b>.</p>`
        : `<p class="sub" style="margin-top:12px"><b lang="es">${esc(v.inf)}</b> is irregular, so there is no ending to add. Tap the right form from its table.</p>`)
        +`<div class="chips-lg" style="margin-top:14px">${opts.map((o,k)=>`<button class="chip-lg" type="button" data-pick="${o.i}" lang="es">${esc(o.label)}<span class="kbd">${k+1}</span></button>`).join('')}</div>`;
    } else {
      body=head+`<form id="vForm" style="margin-top:16px;display:flex;flex-direction:column;gap:12px" autocomplete="off">
        <input type="text" id="vIn" lang="es" placeholder="Type the verb form…" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Your answer">
        ${accentKeys()}
        <div class="row"><button class="btn primary" type="submit">Comprobar <small>check<span class="khint"> · enter</span></small></button><button class="btn ghost" type="button" id="vShow">Show me the table</button></div>
      </form>`;
    }
  } else {
    const r=V.last; const cls=r.kind==='right'?'good':r.kind==='accent'?'warn':'bad';
    const headTxt=r.kind==='right'?'¡Correcto!':r.kind==='accent'?'Almost! Just the accent.':'Not quite.';
    const rule= v.type==='irr'? `<span class="ink">${esc(v.inf)} is irregular. This is one to memorize, so say the whole table out loud once.</span>`
      : `<span class="ink">Regular -${v.type} verb: drop <b>-${v.type}</b> from <b lang="es">${esc(v.inf)}</b> to get the stem <b lang="es">${esc(stem)}-</b>, then add the <b>${esc(PRON[pi])}</b> ending <b>-${esc(ENDINGS[v.type][pi])}</b>.</span>`;
    const expl=`A Spanish 1 student was asked to conjugate "${v.inf}" (${v.en}) for "${PRON[pi]}" and ${r.ans?`answered "${r.ans}"`:'asked to see the answer'}. The correct form is "${target}". In 3 short sentences, explain the rule and give a memory trick.`;
    body=`<div class="feedback ${cls}"><b>${headTxt}</b><span class="ink" style="font-size:20px"><span lang="es">${esc(PRON[pi])}</span> <b class="es" lang="es">${esc(target)}</b> ${speakBtn(PRON[pi].split(' / ')[0]+' '+target)}</span>${r.kind!=='right'&&r.ans?`<span>You ${level==='build'?'picked':'wrote'}: <s lang="es">${esc(r.ans)}</s></span>`:''}${rule}${r.kind==='wrong'?explainBox(expl):''}</div>
      ${level==='build'?optionsBreakdown(v,pi,opts,r.picked):(r.kind!=='right'||r.show?verbTable(v,pi):'')}
      <div class="row" style="margin-top:14px"><button class="btn primary" id="vNext">Siguiente <small>next<span class="khint"> · enter</span></small></button></div>`;
  }
  const nudge = readyToMoveUp()&&!V.nudgeHidden ? `<div class="tip row between" style="margin-top:14px"><span>¡Muy bien! You're at 80%+ on your last 10. Ready to type the forms yourself?</span><span class="row"><button class="btn primary" id="nudgeYes" style="padding:8px 12px">Try typing</button><button class="btn ghost" id="nudgeNo" style="padding:8px 12px;color:var(--sun-ink)">Not yet</button></span></div>` : '';
  main.innerHTML=`<section class="panel lift">
    <div class="row between">
      <div class="row"><span class="eyebrow">Verbos · Verb drill</span>
        <div class="seg" role="group" aria-label="Level">${VLEVELS.map(l=>`<button type="button" data-level="${l.id}" aria-pressed="${l.id===level}">${l.es} <small>${l.en}</small></button>`).join('')}</div></div>
      <span class="sub" style="font-variant-numeric:tabular-nums">${V.right} / ${V.total} · ${acc}${V.run>=3?' · '+V.run+' in a row':''}</span></div>
    <div class="row" style="margin-top:10px"><select id="vGroup" aria-label="Verb set">${VERB_GROUPS.map(g=>`<option value="${g.id}" ${g.id===V.group?'selected':''}>${esc(g.label)}</option>`).join('')}</select></div>

    ${nudge}
  </section>
  <section class="panel"><div class="eyebrow">Endings cheat sheet</div>
    <div class="tbl" style="margin-top:8px"><table><thead><tr><th></th><th>-ar</th><th>-er</th><th>-ir</th></tr></thead><tbody>
    ${PRON.map((p,i)=>(i===4&&!P.settings.vosotros)?'':`<tr><td>${esc(p)}</td><td><b class="es">-${ENDINGS.ar[i]}</b></td><td><b class="es">-${ENDINGS.er[i]}</b></td><td><b class="es">-${ENDINGS.ir[i]}</b></td></tr>`).join('')}
    </tbody></table></div>
    <p class="tip" style="margin-top:12px">Notice: -er and -ir endings are the same except for <span class="es">nosotros</span> (-emos / -imos)${P.settings.vosotros?' and <span class="es">vosotros</span> (-éis / -ís)':''}.</p>

}
function setVerbLevel(l){ if(l===vLevel()) return; P.settings.verbLevel=l; save(); V.cur=null; V.state='ask'; V.right=0; V.total=0; V.run=0; nextVerb(); renderVerbs(); }
function pickVerb(i){ // Build level: i is the pronoun index of the chip tapped

document.addEventListener('keydown',e=>{ if(view!=='verbs'||!V.cur||V.state!=='ask'||vLevel()!=='build') return; if(e.target.matches('input,select,textarea')) return; const k=+e.key; if(k>=1&&k<=V.cur.opts.length) pickVerb(V.cur.opts[k-1].i); });

/* ============================ CONVERSATION ============================ */
// Scripted conversations: the partner speaks a line, the learner picks the reply that fits.
// Two modes: 'read' shows the partner's words, 'listen' hides them until the learner answers.
let C=null;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
const MIC='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>';

function newConv(id,title,d,turns){ C={id,title,d,turns,i:0,picked:null,score:0,said:-1,show:false,en:false,saved:false}; go('talk'); }
function startConv(id){ const d=DIALOGUES.find(x=>x.id===id); newConv(id,d.title,d,d.turns.map(t=>prepTurn(t,false,d.who))); }
function startQuick(){ const pool=[]; DIALOGUES.forEach(d=>d.turns.forEach(t=>{ if(t.q) pool.push(prepTurn(t,true,d.who)); })); newConv('quick','Preguntas rápidas',null,shuffle(pool).slice(0,10)); }
function themBubble(t,{hide,en,now}={}){ return `<div class="msg ai${now?' now':''}"><span class="who">${esc(t.who)}</span>${hide?'<span class="hid">Listen, then pick your reply.</span>':`<span class="line" lang="es">${esc(t.p)}</span>`}${speakBtn(t.p,true)}${en?`<span class="tr">${esc(t.e)}</span>`:''}</div>`; }

  } else {

  if($('#cNext')){ const nb=$('#cNext'); nb.focus({preventScroll:true}); nb.onclick=()=>{ C.i++; C.picked=null; C.show=false; C.en=false; renderTalk(); }; }
